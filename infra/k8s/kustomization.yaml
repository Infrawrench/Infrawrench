apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace and the `infrawrench-env` secret are created by terraform
# (infra/terraform); everything here is the workload layer, applied by CI
# (.github/workflows/web-deploy.yml). Nodes pull from Artifact Registry with
# their own service account, so there is no image pull secret.
namespace: infrawrench

resources:
  - web-deployment.yaml
  - web-service.yaml
  - web-ingress.yaml
  # A more specific /api/ws location with consistent hashing on ?sid=, so a
  # shared console's guests reach the replica holding the pty. See the file.
  - web-ws-ingress.yaml
  - poller-deployment.yaml
  - github-watcher-deployment.yaml
  - cluster-issuer.yaml
  - network-policy.yaml

# The image names below are deliberately unresolvable placeholders: the real
# Artifact Registry host embeds the region and project id, which live in CI
# variables rather than git. CI rewrites name *and* tag before applying:
#   kustomize edit set image \
#     REGION-docker.pkg.dev/PROJECT_ID/infrawrench/<svc>=$AR_REGISTRY/<svc>:$GITHUB_SHA
images:
  - name: REGION-docker.pkg.dev/PROJECT_ID/infrawrench/web
    newTag: bootstrap
  - name: REGION-docker.pkg.dev/PROJECT_ID/infrawrench/poller
    newTag: bootstrap
  - name: REGION-docker.pkg.dev/PROJECT_ID/infrawrench/github-watcher
    newTag: bootstrap
