name: bastion-deploy

# Builds the bastion agent image and pushes it to the self-hosted registry
# (registry.infrawrench.com — our serverless-registry fork on a CF Worker
# backed by R2, deployed from infra/registry). Each architecture builds
# natively on its own runner (no qemu) and pushes by digest; a final
# job stitches the digests into one multi-arch manifest tagged
# :<commit sha> and :latest.
#
# Required repo secrets:
#   REGISTRY_USERNAME — push credentials for registry.infrawrench.com
#   REGISTRY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "app/packages/bastion-agent/**"
      - ".github/workflows/bastion-deploy.yml"
  workflow_dispatch:

concurrency:
  group: bastion-deploy
  cancel-in-progress: false

env:
  IMAGE: registry.infrawrench.com/bastion-agent

jobs:
  build:
    # workflow_dispatch can target any ref; only main may publish.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to registry.infrawrench.com
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: registry.infrawrench.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: app/packages/bastion-agent
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bastion-agent-${{ matrix.arch }}
          cache-to: type=gha,scope=bastion-agent-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to registry.infrawrench.com
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: registry.infrawrench.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create multi-arch manifest for :${{ github.sha }} and :latest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:latest" \
            $(printf -- "$IMAGE@sha256:%s " *)

      - name: Verify pushed manifest
        run: docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}"
