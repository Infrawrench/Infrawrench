name: CI runner

# `ci-runner/` is a standalone Rust workspace outside the pnpm workspace, so
# nothing in test.yml reaches it. This is its whole CI.
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - "ci-runner/**"
      - ".github/workflows/ci-runner.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci-runner/**"
      - ".github/workflows/ci-runner.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The toolchain file is the single source of truth for the version, so a
      # bump does not need a second edit here.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Formatting first: cheapest check, most likely to fail.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The git tests build fixture repositories with the git CLI and serve
      # them over file://, which the runner image has. Nothing here reaches
      # the network: tests that need real packages are #[ignore]d.
      - name: cargo test
        run: cargo test --workspace

      - name: shellcheck the builtin build scripts
        run: shellcheck -x builtins/*/build.sh builtins/lib.sh
