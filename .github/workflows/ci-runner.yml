name: CI runner

# `ci-runner/` is a standalone Rust workspace outside the pnpm workspace, so
# nothing in test.yml reaches it. This is its whole CI.
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - "ci-runner/**"
      - ".github/workflows/ci-runner.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci-runner/**"
      - ".github/workflows/ci-runner.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The toolchain file is the single source of truth for the version, so a
      # bump does not need a second edit here.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Formatting first: cheapest check, most likely to fail.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The git tests build fixture repositories with the git CLI and serve
      # them over file://, which the runner image has. Nothing here reaches
      # the network: tests that need real packages are #[ignore]d.
      - name: cargo test
        run: cargo test --workspace

      - name: shellcheck the builtin scripts
        run: shellcheck -x builtins/*/build.sh builtins/environments/edgejs/build.sh builtins/lib.sh builtins/test.sh builtins/publish.sh crates/iwci-runtime/modes/*

  # The builtins that are cheap to build, built from their own scripts and
  # tested twice: the runtime's fixture tests (which skip without fixtures
  # in the job above, and fail here instead), and builtins/test.sh, which
  # publishes them to a throwaway store and runs pipelines through `iwci
  # run`. typescript, oxfmt and bash-node need much larger toolchains and
  # are tested by ci-runner-builtins.yml.
  # The `node` feature links V8, so it builds on its own: on ARM64 that is
  # the vendored bridge's Linux ARM64 V8, its `c_char` and its libatomic,
  # none of which the x86 release would notice breaking.
  node-arm64:
    name: Build with Node on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          key: node-arm64

      - name: cargo build --features node
        run: |
          cargo build -p iwci --features node
          ./target/debug/iwci version

  builtins:
    name: Builtins (gofmt, bash, tools)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Any Go will do: the build script pins its own with GOTOOLCHAIN.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.3"
          cache: false

      # Downloads are checked against the content hashes pinned in the
      # scripts, so a changed upstream package fails here. Only bash:
      # bash-node's Edge.js is built from source on x86_64, by
      # ci-runner-builtins.yml.
      - name: Build gofmt and the bash environment
        run: |
          bash builtins/gofmt/build.sh
          bash builtins/environments/build.sh bash

      # Paths found rather than written down, so a version bump in a build
      # script needs no edit here.
      - name: Locate the built fixtures
        run: |
          echo "IWCI_TEST_GOFMT_WASM=$(ls "$PWD"/dist/builtin/gofmt/*/module.wasm)" >> "$GITHUB_ENV"
          echo "IWCI_TEST_WEBC_DIR=$(ls -d "$PWD"/dist/environment/bash/*)" >> "$GITHUB_ENV"

      - name: Runtime tests against the built builtins
        env:
          IWCI_REQUIRE_FIXTURES: "1"
        run: cargo test -p iwci-runtime

      - name: Publish and run them through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh gofmt bash tools

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        # bash-node is published by ci-runner-builtins.yml, whose job runs it under V8.
        run: bash builtins/publish.sh dist/builtin/gofmt/* dist/environment/bash/*
