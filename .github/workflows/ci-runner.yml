name: CI runner

# `ci-runner/` is a standalone Rust workspace outside the pnpm workspace, so
# nothing in test.yml reaches it. This is its whole CI.
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - "ci-runner/**"
      - ".github/workflows/ci-runner.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci-runner/**"
      - ".github/workflows/ci-runner.yml"

# A pull request's newer push replaces its older run. On main, a run
# publishes what it built (env:clickhouse takes about four hours), so a newer
# push queues behind it instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The toolchain file is the single source of truth for the version, so a
      # bump does not need a second edit here.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Formatting first: cheapest check, most likely to fail.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The git tests build fixture repositories with the git CLI and serve
      # them over file://, which the runner image has. Nothing here reaches
      # the network: tests that need real packages are #[ignore]d.
      - name: cargo test
        run: cargo test --workspace

      - name: shellcheck the builtin scripts
        run: shellcheck -x builtins/*/build.sh builtins/environments/edgejs/build.sh builtins/environments/go/build.sh builtins/environments/php-cli/build.sh builtins/environments/pglite-server/build.sh builtins/environments/git/build.sh builtins/environments/bash/build.sh builtins/environments/sed/build.sh builtins/environments/patch-module.sh builtins/environments/cloud-clis/*.sh builtins/environments/php-cli/fs/bin/* builtins/lib.sh builtins/test.sh builtins/publish.sh builtins/build-cache.sh builtins/v8/archive.sh release-build.sh crates/iwci-runtime/modes/* crates/iwci-runtime/services/* crates/iwci-sandbox/tests/fixtures.sh

  # The lisafs server (crates/iwci-sandbox) under gVisor's real kernel, on
  # both architectures the runners are: a busybox shell and Bun run in a
  # sandbox whose only file system is a job's, and the test checks what
  # they saw and what they changed. Root, because the sandbox is started
  # in new user namespaces, which Ubuntu's AppArmor keeps from other users
  # (the runner hosts get a profile for it instead). gVisor and Bun are
  # pinned by hash in tests/fixtures.sh.
  sandbox:
    name: Sandbox under gVisor (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          key: sandbox-${{ matrix.arch }}

      - name: busybox
        run: sudo apt-get install -y --no-install-recommends busybox-static

      - name: gVisor and Bun, pinned
        run: bash crates/iwci-sandbox/tests/fixtures.sh "$RUNNER_TEMP/sandbox" | tee -a "$GITHUB_ENV"

      # Built as the runner's user, run as root in a scope with a cgroup
      # subtree of its own, as the runner's unit delegates one on the hosts.
      - name: cargo test --test gvisor
        run: |
          bin=$(cargo test -p iwci-sandbox --test gvisor --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "gvisor") | .executable')
          sudo systemd-run --scope --quiet -p Delegate=yes \
            env IWCI_REQUIRE_FIXTURES=1 IWCI_TEST_CGROUP=1 IWCI_TEST_BUSYBOX=/bin/busybox \
            IWCI_TEST_GVISOR="$IWCI_TEST_GVISOR" IWCI_TEST_BUN_ROOT="$IWCI_TEST_BUN_ROOT" \
            "$bin" --ignored --test-threads=1 --nocapture

  # The builtins that are cheap to build, built from their own scripts and
  # tested twice: the runtime's fixture tests (which skip without fixtures
  # in the job above, and fail here instead), and builtins/test.sh, which
  # publishes them to a throwaway store and runs pipelines through `iwci
  # run`. typescript, oxfmt and bash-node need much larger toolchains and
  # are tested by ci-runner-builtins.yml.
  # The `node` feature links V8, so it builds on its own: on ARM64 that is
  # the ARM64 build of the bridge's V8, its `c_char` and its libatomic,
  # none of which the x86 release would notice breaking. It also runs the
  # tests of the crates the feature changes, built as a release is: the
  # feature turns on more than the bridge (wasmer-napi enables
  # wasmer-wasix's host features for the whole build), so a test can pass
  # in the job above and fail here (#1157).
  node-arm64:
    name: Build and test with Node on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          key: node-arm64

      # The bridge links V8 15.9 built by builtins/v8/build.sh (hours, so not
      # here), kept in the runner pool's bucket and checked against the
      # SHA-256 pinned in vendor/wasmer-napi/build.rs.
      - name: V8 for the bridge, from the runner pool's bucket
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/v8/archive.sh fetch

      - name: cargo build --features node
        run: |
          cargo build -p iwci --features node
          ./target/debug/iwci version

      # Without fixtures, like `cargo test` in the job above: the tests that
      # need a built environment skip here and run in ci-runner-builtins.yml.
      - name: cargo test --features node
        run: cargo test -p iwci -p iwci-runtime --features iwci/node

  builtins:
    name: Builtins (gofmt, bash, tools)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Any Go will do: the build script pins its own with GOTOOLCHAIN.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.3"
          cache: false

      # Every environment carries Git, built from source
      # (builtins/environments/git/build.sh: two or three minutes). The build
      # is reproducible and environments/build.sh checks the package against
      # the hash it pins, so a restored one is as good as a fresh one. The
      # build cache (builtins/build-cache.sh, as in ci-runner-builtins.yml)
      # keys it by git/, Edge.js's wasix-libc-*.patch, lib.sh and the
      # platform, so each architecture's build is checked against the pin.
      - name: Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      # Downloads are checked against the content hashes pinned in the
      # scripts, so a changed upstream package fails here. Only bash:
      # bash-node's Edge.js is built from source on x86_64, by
      # ci-runner-builtins.yml.
      - name: Build gofmt and the bash environment
        run: |
          bash builtins/gofmt/build.sh
          bash builtins/environments/build.sh bash

      # Paths found rather than written down, so a version bump in a build
      # script needs no edit here.
      - name: Locate the built fixtures
        run: |
          echo "IWCI_TEST_GOFMT_WASM=$(ls "$PWD"/dist/builtin/gofmt/*/module.wasm)" >> "$GITHUB_ENV"
          echo "IWCI_TEST_WEBC_DIR=$(ls -d "$PWD"/dist/environment/bash/*)" >> "$GITHUB_ENV"

      - name: Runtime tests against the built builtins
        env:
          IWCI_REQUIRE_FIXTURES: "1"
        run: cargo test -p iwci-runtime

      - name: Publish and run them through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh gofmt bash tools

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        # bash-node is published by ci-runner-builtins.yml, whose job runs it under V8.
        run: bash builtins/publish.sh dist/builtin/gofmt/* dist/environment/bash/*
