        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          shared-key: ruby-${{ runner.arch }}
          save-if: ${{ matrix.minor == '4.0' }}

      # Every environment carries Git, built from source
      # (builtins/environments/git/build.sh: two or three minutes). See the
      # bash-node job.
      - name: Git, built or restored from the build cache
