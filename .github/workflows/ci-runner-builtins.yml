name: CI runner builtins

# The builtins whose builds need a large toolchain of their own: tsc-rs
# (binaryen, Node), oxfmt (the WASIX Rust toolchain) and Edge.js (built from
# source with wasixcc, run under the runner's V8, `--features node`), and the
# language environments, whose tests install packages from the internet
# (pip, Composer, Go modules), Go's built from source for each minor,
# kubectl, built with that Go from modules it downloads, OpenSSH's
# clients, built from source with wasixcc and OpenSSL, and ClickHouse,
# built from CloudHouse with Emscripten (hours). Each job builds one with its
# own script in ci-runner/builtins/, then runs builtins/test.sh, which
# publishes it to a throwaway store and runs pipelines through `iwci run`.
# gofmt and bash are cheap and are tested on every change by ci-runner.yml.
#
# The slow builds go through builtins/build-cache.sh, which keeps each in the
# runner pool's bucket under build-cache/, keyed by a SHA-256 of its build
# script, patches, lib.sh, the platform and the toolchain the job installs:
# a key already there is downloaded and checked rather than built. Pushes to
# main read and write build-cache/main/; a pull request reads main/ and then
# its own pr/<number>/, and writes only that; a fork's, without secrets,
# builds everything. The script's header lists what each key holds, and
# ci-runner/README.md ("The build cache") how to rebuild everything.
#
# Nightly as well as on changes, because the builds reach things this
# repository does not pin byte for byte: the WASIX toolchain cargo-wasix
# installs, and the crates tsc-rs and Oxc resolve.
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci-runner/builtins/**"
      - "ci-runner/crates/iwci-runtime/**"
      - "ci-runner/crates/iwci-store/**"
      # The vendored V8 bridge is what runs Node jobs: a change to it alone
      # (a V8 flag, a platform fix) must run bash-node on Edge.js too.
      - "ci-runner/vendor/**"
      - "ci-runner/crates/iwci/src/cli/publish.rs"
      - "ci-runner/Cargo.lock"
      - "ci-runner/rust-toolchain.toml"
      - ".github/workflows/ci-runner-builtins.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci-runner/builtins/**"
      - "ci-runner/crates/iwci-runtime/**"
      - "ci-runner/crates/iwci-store/**"
      # The vendored V8 bridge is what runs Node jobs: a change to it alone
      # (a V8 flag, a platform fix) must run bash-node on Edge.js too.
      - "ci-runner/vendor/**"
      - "ci-runner/crates/iwci/src/cli/publish.rs"
      - "ci-runner/Cargo.lock"
      - "ci-runner/rust-toolchain.toml"
      - ".github/workflows/ci-runner-builtins.yml"

# A pull request's newer push replaces its older run. On main, a run
# publishes what it built (env:clickhouse takes about four hours), so a newer
# push queues behind it instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: typescript (tsc-rs)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    # The toolchain the build uses beyond what its script pins; the build
    # cache's key holds these.
    env:
      NODE_VERSION: "24"
      BINARYEN: version_133
      BINARYEN_SHA256: 89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # tsc-rs's build orders the module's functions with a Node script.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # tsc-rs needs wasm-opt 132 or later; Ubuntu's package is far older.
      - name: Install binaryen
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-aarch64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      # Key: typescript/ (build.sh pins the tsc-rs tag), lib.sh,
      # rust-toolchain.toml, the platform, Binaryen and Node. The nightly run
      # builds it afresh: crates and the toolchain tsc-rs resolves are not
      # pinned byte for byte here.
      - name: Build, or restore from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          BUILD_CACHE_TOOLCHAIN: binaryen ${{ env.BINARYEN }} ${{ env.BINARYEN_SHA256 }}, node ${{ env.NODE_VERSION }}
        run: bash builtins/build-cache.sh build typescript

      # The runtime's own test of the compiler, #[ignore]d everywhere else.
      - name: Runtime test against the built compiler
        run: |
          IWCI_TEST_TS_RUST_WASM="$(ls "$PWD"/dist/builtin/typescript/*/module.wasm)"
          export IWCI_TEST_TS_RUST_WASM
          cargo test -p iwci-runtime real_tsc -- --ignored

      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh typescript

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh

  oxfmt:
    name: oxfmt
    # The WASIX toolchain that cargo-wasix installs is published for x86_64
    # Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    # In the build cache's key, with the lld Ubuntu's archive has.
    env:
      CARGO_WASIX_VERSION: 0.1.34
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Key: oxfmt/ (build.sh pins the Oxc tag; its patch), lib.sh,
      # rust-toolchain.toml, the platform and cargo-wasix's version. The
      # nightly run builds it afresh: the WASIX toolchain cargo-wasix
      # installs is its newest release, not a pin.
      - name: Restore from the build cache
        id: cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          BUILD_CACHE_TOOLCHAIN: cargo-wasix ${{ env.CARGO_WASIX_VERSION }}, lld
        run: bash builtins/build-cache.sh fetch oxfmt

      # The WASIX toolchain links host build scripts with -fuse-ld=lld but
      # does not ship the wrapper that flag looks for; the system lld is it.
      - name: Install lld and cargo-wasix
        if: steps.cache.outputs.hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lld
          cargo install cargo-wasix --version "$CARGO_WASIX_VERSION" --locked

      # cargo-wasix looks up its toolchain release through the GitHub API,
      # which rate-limits anonymous requests from shared runners; it sends
      # GITHUB_TOKEN when set.
      - name: Build, unless restored
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          BUILD_CACHE_TOOLCHAIN: cargo-wasix ${{ env.CARGO_WASIX_VERSION }}, lld
          GITHUB_TOKEN: ${{ github.token }}
        run: bash builtins/build-cache.sh build oxfmt

      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh oxfmt

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh

      # The module, so a failure can be reproduced against a local runner
      # without the WASIX toolchain.
      - name: Keep the built module
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oxfmt-module
          path: ci-runner/dist/builtin/oxfmt
          retention-days: 7
          if-no-files-found: ignore

  bash-node:
    name: bash-node (Edge.js on V8)
    # wasmer-napi's build script downloads a prebuilt V8, and there is no
    # Linux arm64 build of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      - name: Build the runner with V8
        run: cargo build -p iwci --features node

      # Edge.js is built from source (builtins/environments/edgejs/build.sh:
      # about ten minutes here, with 600 MB of pinned downloads), and every
      # environment carries Git, also built from source
      # (builtins/environments/git/build.sh: two or three minutes). Both
      # builds are reproducible, and both packages are checked against the
      # hashes environments/build.sh pins, after a restore as after a build,
      # so a restored one is as good as a fresh one.
      # Keys: edgejs/ (build.sh and every patch) and lib.sh; git/, Edge.js's
      # wasix-libc-*.patch and lib.sh; and the platform, so each
      # architecture's Git is its own build, checked against the pin.
      - name: Edge.js and Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build edgejs git

      - name: Build the environment
        run: bash builtins/environments/build.sh bash-node

      - name: Publish and run it through iwci
        run: SKIP_BUILD=1 bash builtins/test.sh bash-node

      # One `node` that needs most of the V8 heap space after two dozen
      # others ended, in a runner of its own (#1134).
      - name: V8 heap room after other nodes end
        run: SKIP_BUILD=1 bash builtins/test.sh bash-node-pool

      # A Node server as a service (`services:`), and V8's engine flags
      # being the runner's, in the runtime's own tests.
      - name: Runtime tests of Node services and V8's flags
        run: |
          dir="$(ls -d "$PWD"/dist/environment/bash-node/*)"
          IWCI_TEST_NODE_WEBC_DIR="$dir" IWCI_TEST_WEBC_DIR="$dir" IWCI_REQUIRE_FIXTURES=1 \
            cargo test -p iwci-runtime --features node -- service engine_flags

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/environment/bash-node/*

  clickhouse:
    name: clickhouse (CloudHouse for WebAssembly)
    # Its environment carries Edge.js, and its jobs run Node (the runner with
    # V8, which wasmer-napi has no Linux arm64 build of), as bash-node's do.
    runs-on: ubuntu-24.04
    # A build from scratch is about 6,900 objects: two to three hours on
    # this runner's four cores. Pull requests and nightly runs reuse the
    # cached package (below) until something it is built from changes.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      - name: Build the runner with V8
        run: cargo build -p iwci --features node

      # See the bash-node job.
      - name: Edge.js and Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build edgejs git

      # builtins/environments/clickhouse/build.sh pins CloudHouse, its
      # submodules, emsdk, CMake and Ninja, and builds at a fixed path, so the
      # package is reproducible, and it is checked against the hash pinned in
      # environments/build.sh after a restore as after a build: a restored
      # one is as good as a fresh one, and a wrong one fails either way.
      # Key: clickhouse/ (build.sh, cloudhouse-ci.patch, server.mjs), lib.sh
      # and the platform.
      - name: Restore ClickHouse from the build cache
        id: cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh fetch clickhouse

      # The sources, emsdk and the build take about 12 GB.
      - name: Make room for the build
        if: steps.cache.outputs.hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ClickHouse, unless restored
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          CLICKHOUSE_JOBS: "4"
        run: bash builtins/build-cache.sh build clickhouse

      - name: Build the environment
        run: bash builtins/environments/build.sh clickhouse

      - name: Publish and run it through iwci
        run: SKIP_BUILD=1 bash builtins/test.sh clickhouse

      # A build that came out different, kept to compare with the pinned one.
      - name: Keep the package
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clickhouse-package
          path: ci-runner/dist/package/clickhouse
          retention-days: 7
          if-no-files-found: ignore

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/environment/clickhouse/*

  python:
    name: python (CPython on WASIX)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Every environment carries Git, built from source
      # (builtins/environments/git/build.sh: two or three minutes). See the
      # bash-node job.
      - name: Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      # And env:postgres, which Python jobs use as a service.
      - name: Build the environments
        run: bash builtins/environments/build.sh python postgres

      # Its jobs install from PyPI and Wasmer's WASIX wheel index.
      - name: Publish and run them through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh python postgres

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/environment/python/* dist/environment/postgres/*

  php:
    name: php (phpix on WASIX)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Every environment carries Git, built from source
      # (builtins/environments/git/build.sh: two or three minutes). See the
      # bash-node job.
      - name: Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      # All five versions, and php-cli (environments/php-cli/build.sh), whose
      # hash is pinned: built here on ARM64, it must come out as it does on
      # x86_64.
      - name: Build the environments
        run: bash builtins/environments/build.sh php

      # Its jobs install from Packagist.
      - name: Publish and run them through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh php

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/environment/php/*

  kubectl:
    name: kubectl (Go for WASIX)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Its jobs are bash scripts, and every environment carries Git
      # (see the bash-node job).
      - name: Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      - name: Build the bash environment
        run: bash builtins/environments/build.sh bash

      # Go's archive with env:go's patch series, and kubectl's modules,
      # pinned by builtins/kubectl/<minor>/go.sum (a few minutes). The module
      # is checked against the hash kubectl/build.sh pins, after a restore as
      # after a build. Key: kubectl/, environments/go/ (the toolchain's pins
      # and patch series), lib.sh and the platform.
      - name: kubectl, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build kubectl@1.37

      # Against the fake API server its build makes, on the job's loopback,
      # with a kubeconfig lent as the app lends a connection.
      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh bash kubectl

      # Main only: what passed above becomes what runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/builtin/kubectl/*

  openssh:
    name: openssh (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Both architectures: the modules' hashes are pinned, so a build
        # on either must come out the same.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # Its jobs are bash scripts, and every environment carries Git
      # (see the bash-node job).
      - name: Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      - name: Build the bash environment
        run: bash builtins/environments/build.sh bash

      # OpenSSH and OpenSSL from source on Git's toolchain and C library,
      # each module checked against its pinned hash (after a restore as after
      # a build), and the test server with env:go's toolchain (a few
      # minutes). Key: openssh/, environments/git/ (whose pins it reads),
      # Edge.js's wasix-libc-*.patch, environments/go/, lib.sh and the
      # platform.
      - name: OpenSSH, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build openssh

      # Against SSH servers on the job's own loopback, with connections and
      # keys lent as the app lends them. The fixture's keys are made here.
      - name: Publish and run them through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh bash openssh

      # Main only: what passed above becomes what runners resolve. Once,
      # from x86_64; the ARM64 build above is the same bytes.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.runner == 'ubuntu-24.04'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/builtin/{ssh,scp,sftp,ssh-keygen,ssh-keyscan}/*

  go:
    name: go ${{ matrix.minor }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        minor: ["1.23", "1.24", "1.25", "1.26", "1.27"]
        # Both architectures: the build must come out byte for byte the same
        # on each (the pins below check it), and the toolchain must run on
        # both runner pools.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      # One cache per architecture for all five minors: the runner they
      # build is the same.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          shared-key: go-${{ runner.arch }}
          save-if: ${{ matrix.minor == '1.27' }}

      # Every environment carries Git, built from source
      # (builtins/environments/git/build.sh: two or three minutes). See the
      # bash-node job.
      - name: Git, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      # From go.dev's release archive and the patch series in
      # builtins/environments/go/<minor>/ (a minute or two). The build is
      # reproducible, and both of its packages are checked against the
      # hashes environments/build.sh pins, after a restore as after a build.
      # Key: go/build.sh, go/<minor>/, lib.sh and the platform.
      - name: Go, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build go@${{ matrix.minor }}

      - name: Build the environment
        run: bash builtins/environments/build.sh go@${{ matrix.minor }}

      # Its jobs fetch a module and an HTTPS page.
      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh go@${{ matrix.minor }}

      # Main only, and from one architecture: what passed above becomes what
      # runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.runner == 'ubuntu-24.04'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/environment/go/*
