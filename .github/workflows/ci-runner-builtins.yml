name: CI runner builtins

# The builtins whose builds need a large toolchain of their own: tsc-rs
# (binaryen, Node), oxfmt (the WASIX Rust toolchain) and Edge.js under the
# runner's V8 (`--features node`). Each job builds one with its own script
# in ci-runner/builtins/, then runs builtins/test.sh, which publishes it to a
# throwaway store and runs pipelines through `iwci run`. gofmt and bash are
# cheap and are tested on every change by ci-runner.yml.
#
# Nightly as well as on changes, because the builds reach things this
# repository does not pin byte for byte: the WASIX toolchain cargo-wasix
# installs, and the crates tsc-rs and Oxc resolve.
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci-runner/builtins/**"
      - "ci-runner/crates/iwci-runtime/**"
      - "ci-runner/crates/iwci-store/**"
      - "ci-runner/crates/iwci/src/cli/publish.rs"
      - "ci-runner/Cargo.lock"
      - "ci-runner/rust-toolchain.toml"
      - ".github/workflows/ci-runner-builtins.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci-runner/builtins/**"
      - "ci-runner/crates/iwci-runtime/**"
      - "ci-runner/crates/iwci-store/**"
      - "ci-runner/crates/iwci/src/cli/publish.rs"
      - "ci-runner/Cargo.lock"
      - "ci-runner/rust-toolchain.toml"
      - ".github/workflows/ci-runner-builtins.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: typescript (tsc-rs)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      # tsc-rs's build orders the module's functions with a Node script.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # tsc-rs needs wasm-opt 132 or later; Ubuntu's package is far older.
      - name: Install binaryen
        env:
          BINARYEN: version_133
          BINARYEN_SHA256: 89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-aarch64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      - name: Build
        run: bash builtins/typescript/build.sh

      # The runtime's own test of the compiler, #[ignore]d everywhere else.
      - name: Runtime test against the built compiler
        run: |
          IWCI_TEST_TS_RUST_WASM="$(ls "$PWD"/dist/builtin/typescript/*/module.wasm)"
          export IWCI_TEST_TS_RUST_WASM
          cargo test -p iwci-runtime real_tsc -- --ignored

      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh typescript

  oxfmt:
    name: oxfmt
    # The WASIX toolchain that cargo-wasix installs is published for x86_64
    # Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      - name: Install cargo-wasix
        run: cargo install cargo-wasix --version 0.1.34 --locked

      - name: Build
        run: bash builtins/oxfmt/build.sh

      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh oxfmt

  bash-node:
    name: bash-node (Edge.js on V8)
    # wasmer-napi's build script downloads a prebuilt V8, and there is no
    # Linux arm64 build of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Known broken: node segfaults the runner as it starts (#905). The job
    # keeps running so it shows when that is fixed; remove this line then.
    continue-on-error: true
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner

      - name: Build the runner with V8
        run: cargo build -p iwci --features node

      - name: Build the environments
        run: bash builtins/environments/build.sh

      - name: Publish and run it through iwci
        run: SKIP_BUILD=1 bash builtins/test.sh bash-node
