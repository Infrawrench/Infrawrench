          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build git

      # The native Ruby the cross build runs is built first, with its own
      # zlib, OpenSSL and libyaml extensions (RubyGems unpacks the bundled
      # gems with them). The gems' build reads pkg-config files, makes
      # libffi's configure script (autoconf, automake, libtool) and builds
      # MariaDB Connector/C, for mysql2, with CMake.
      - name: Install a native Ruby's build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libyaml-dev libssl-dev zlib1g-dev libffi-dev \
            pkg-config autoconf automake libtool libltdl-dev cmake

      # CRuby from its release tarball with wasixcc (ten to twenty minutes):
      # the toolchain, the C library objects, zlib, OpenSSL and libyaml, a
      # native Ruby, then Ruby for WASIX. The package is checked against the
      # hash environments/build.sh pins, after a restore as after a build.
      # Key: environments/ruby/, the C library patches it shares with
      # Edge.js, lib.sh and the platform.
      - name: Ruby, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build ruby@${{ matrix.minor }}

      # The native extensions of gems.txt's gems for that Ruby (ten to twenty
      # minutes, the database drivers, each with its own OpenSSL, and
      # libxml2 and libxslt the longest), with the same toolchain
      # and native Ruby: one archive, checked against the digest
      # crates/iwci/src/gem_builds.rs pins, after a restore as after a build.
      # Key: environments/ruby/gems/, toolchain.sh, lib.sh and the platform.
      - name: Gem extensions, built or restored from the build cache
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/build-cache.sh build ruby-gems@${{ matrix.minor }}

      # And env:postgres, which the pg jobs use as a service.
      - name: Build the environments
        run: bash builtins/environments/build.sh ruby@${{ matrix.minor }} postgres

      # Its jobs install gems from rubygems.org, and a `rails new` app's
      # lock and the database drivers' through `deps: [bundler]`.
      - name: Publish and run it through iwci
        run: |
          cargo build -p iwci
          SKIP_BUILD=1 bash builtins/test.sh ruby@${{ matrix.minor }}

      # Main only, and from one architecture: what passed above becomes what
      # runners resolve.
      - name: Publish to the runner pool
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.runner == 'ubuntu-24.04'
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
        run: bash builtins/publish.sh dist/environment/ruby/* dist/blobs/ruby-gems/*

