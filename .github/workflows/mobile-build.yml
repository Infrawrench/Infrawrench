name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "app/packages/mobile/**"
      - "app/packages/client-core/**"
      - "plugin-architecture/packages/plugin-base/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-preview:
    name: EAS preview build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: EAS build (preview)
        working-directory: app/packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform all --profile preview --non-interactive
