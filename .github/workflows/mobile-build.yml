name: Mobile Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-preview:
    name: EAS preview build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # iOS ad-hoc profiles are rebuilt against the registered device list on
      # every run, so a device added via `eas device:create` since the last
      # build can still install the artifact. Needs an ASC API key on disk.
      - name: Write App Store Connect API key
        env:
          EXPO_ASC_API_KEY_BASE64: ${{ secrets.EXPO_ASC_API_KEY_BASE64 }}
        run: |
          set -eo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/asc-api-key.p8"
          echo "$EXPO_ASC_API_KEY_BASE64" | base64 --decode > "${RUNNER_TEMP}/asc-api-key.p8"

      # `--non-interactive` also disables eas-cli's capability syncing: it only
      # syncs when an Apple auth context already exists, and the best-effort
      # authenticate bails out on non-interactive before it can use the ASC key
      # here. Apple auth happens later, when the profile is minted — so CI can
      # rebuild a profile but never registers new capabilities on the App ID.
      # Adding an entitlement to `ios.entitlements` therefore needs a one-time
      # manual enable at developer.apple.com -> Identifiers, or an interactive
      # `eas build` from a workstation; this job then picks it up on the next
      # run. Removing the flag is not an option: the interactive ad-hoc path
      # prompts for device selection.
      # eas-cli is not a workspace dependency, so it is pinned here (and in
      # mobile-release.yml) instead of letting npx fetch whatever is latest
      # into a job holding EXPO_TOKEN and the ASC key. Keep both pins at or
      # above eas.json `cli.version`.
      - name: EAS build (preview)
        working-directory: app/packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
        run: |
          npx -y eas-cli@24.10.0 build --platform all --profile preview --non-interactive \
            --refresh-ad-hoc-provisioning-profile
