name: Deploy Status Page Edge

on:
  push:
    branches: [main]
    paths:
      - "app/packages/status-page-edge/**"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-status-page-edge-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-status-page-edge-

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # Hostname→slug routing is what makes a vanity status URL resolve, so the
      # Worker's own tests gate deploys the same way egress-proxy does.
      - name: Test
        run: pnpm --filter @infrawrench/status-page-edge test

      - name: Deploy
        run: pnpm --filter @infrawrench/status-page-edge exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
