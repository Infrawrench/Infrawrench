name: AI Slop Cleanup

on:
  workflow_dispatch:

jobs:
  execute:
    name: Execute slop cleanup markdown
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run Claude Code with prompt file
        uses: grll/claude-code-base-action@beta
        with:
          prompt_file: ".github/prompts/CLEANUP.md"
          allowed_tools: "Bash(git:*),Bash(pnpm:*),Bash(node:*),Bash(npx:*),View,GlobTool,GrepTool,BatchTool,Edit,Monitor,Skill,Write"
          use_oauth: "true"
          claude_access_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          claude_refresh_token: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          claude_expires_at: ${{ secrets.CLAUDE_EXPIRES_AT }}
          secrets_admin_pat: ${{ secrets.SECRETS_ADMIN_PAT}}
