name: Build Desktop App

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r2-setup:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    name: Ensure R2 lifecycle policy
    steps:
      - name: Apply lifecycle rule (7-day TTL on desktop-builds/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          cat > lifecycle.json <<'EOF'
          {
            "Rules": [
              {
                "ID": "expire-desktop-builds",
                "Status": "Enabled",
                "Filter": { "Prefix": "desktop-builds/" },
                "Expiration": { "Days": 7 },
                "AbortIncompleteMultipartUpload": { "DaysAfterInitiation": 1 }
              }
            ]
          }
          EOF
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "${R2_BUCKET}" \
            --lifecycle-configuration file://lifecycle.json \
            --endpoint-url "${R2_ENDPOINT}"

  linux-arm64-build:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    name: Build on ubuntu-24.04-arm
    needs: r2-setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential flatpak flatpak-builder
      - name: Setup cache
        uses: actions/cache@v5
        with:
          key: ${{ matrix.platform }}-cache-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
            .turbo
            node_modules
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Copy env.production.ts to env.ts for desktop package
        run: cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts
      - name: Build plugin dependencies
        run: pnpm turbo build --filter='@infrawrench/desktop^...'
      - name: Build
        run: pnpm --filter @infrawrench/desktop dist --linux deb appimage
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          tar -czf "${RUNNER_TEMP}/dist-linux-arm64.tar.gz" -C app/packages/desktop/dist .
          aws s3 cp "${RUNNER_TEMP}/dist-linux-arm64.tar.gz" \
            "s3://${R2_BUCKET}/desktop-builds/${GITHUB_RUN_ID}/dist-linux-arm64.tar.gz" \
            --endpoint-url "${R2_ENDPOINT}"

  check-if-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    name: Check if this is a new tag and get the release notes if it is
    outputs:
      package-version: ${{ steps.check-if-release.outputs.PACKAGE_VERSION }}
      release-notes: ${{ steps.check-if-release.outputs.RELEASE_NOTES }}
    steps:
      - name: Install git-cliff
        run: |
          set -eo pipefail
          wget https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          tar -xvzf git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          sudo mv ./git-cliff-2.12.0/git-cliff /usr/local/bin/git-cliff
          sudo chmod +x /usr/local/bin/git-cliff
          rm git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          rm -rf git-cliff-2.12.0
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check if this is a new tag
        id: check-if-release
        run: |
          set -eo pipefail
          PACKAGE_VERSION=$(jq -r '.version' app/packages/desktop/package.json)
          if [ -n "$(git tag -l "v${PACKAGE_VERSION}")" ]; then
            echo "PACKAGE_VERSION=" >> $GITHUB_OUTPUT
            echo "RELEASE_NOTES=" >> $GITHUB_OUTPUT
          else
            echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
            git-cliff --unreleased --output CHANGELOG.md
            echo "RELEASE_NOTES=$(base64 -w 0 CHANGELOG.md)" >> $GITHUB_OUTPUT
            rm CHANGELOG.md
          fi

  linux-x64-build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Build on ubuntu-24.04
    needs: [check-if-release, r2-setup]
    if: needs.check-if-release.outputs.package-version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential flatpak flatpak-builder
      - name: Setup cache
        uses: actions/cache@v5
        with:
          key: ${{ matrix.platform }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
            .turbo
            node_modules
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Copy env.production.ts to env.ts for desktop package
        run: cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts
      - name: Build plugin dependencies
        run: sudo env "PATH=$PATH" pnpm turbo build --filter='@infrawrench/desktop^...'
      - name: Build
        run: sudo env "PATH=$PATH" pnpm --filter @infrawrench/desktop dist --linux deb appimage snap
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          sudo tar -czf "${RUNNER_TEMP}/dist-linux-x64.tar.gz" -C app/packages/desktop/dist .
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/dist-linux-x64.tar.gz"
          aws s3 cp "${RUNNER_TEMP}/dist-linux-x64.tar.gz" \
            "s3://${R2_BUCKET}/desktop-builds/${GITHUB_RUN_ID}/dist-linux-x64.tar.gz" \
            --endpoint-url "${R2_ENDPOINT}"

  macos-build:
    strategy:
      matrix:
        platform: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.platform }}
    name: Build on ${{ matrix.platform }}
    needs: [check-if-release, r2-setup]
    if: needs.check-if-release.outputs.package-version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup cache
        uses: actions/cache@v5
        with:
          key: ${{ matrix.platform }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
            .turbo
            node_modules
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Copy env.production.ts to env.ts for desktop package
        run: cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts
      - name: Setup Keychain
        env:
          MACOS_APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_BASE64 }}
          MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail

          APP_CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/developer_id_installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_APP_CERTIFICATE_BASE64" | base64 --decode > "$APP_CERT_PATH"
          echo "$MACOS_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$APP_CERT_PATH" \
            -P "$MACOS_APP_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security import "$INSTALLER_CERT_PATH" \
            -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Available code signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Build plugin dependencies
        run: pnpm turbo build --filter='@infrawrench/desktop^...'
      - name: Build
        run: pnpm --filter @infrawrench/desktop dist
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          tar -czf "${RUNNER_TEMP}/dist-${{ matrix.platform }}.tar.gz" -C app/packages/desktop/dist .
          aws s3 cp "${RUNNER_TEMP}/dist-${{ matrix.platform }}.tar.gz" \
            "s3://${R2_BUCKET}/desktop-builds/${GITHUB_RUN_ID}/dist-${{ matrix.platform }}.tar.gz" \
            --endpoint-url "${R2_ENDPOINT}"

  windows-build:
    strategy:
      matrix:
        platform: [blacksmith-4vcpu-windows-2025, windows-11-arm]
    runs-on: ${{ matrix.platform }}
    name: Build on ${{ matrix.platform }}
    needs: [check-if-release, r2-setup]
    if: needs.check-if-release.outputs.package-version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup cache
        uses: actions/cache@v5
        with:
          key: ${{ matrix.platform }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
            .turbo
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - name: Skip workerd build (unsupported on Windows ARM64)
        if: matrix.platform == 'windows-11-arm'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.pnpm = { ...pkg.pnpm, neverBuiltDependencies: ['workerd'] };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - run: pnpm install --frozen-lockfile
      - name: Copy env.production.ts to env.ts for desktop package
        run: cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts
      - name: Build plugin dependencies
        run: pnpm turbo build --filter='@infrawrench/desktop^...'
      - name: Build
        run: pnpm --filter @infrawrench/desktop dist
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          # --force-local: GNU tar in Git Bash otherwise treats `D:` as host:path.
          tar --force-local -czf "${RUNNER_TEMP}/dist-${{ matrix.platform }}.tar.gz" -C app/packages/desktop/dist .
          aws s3 cp "${RUNNER_TEMP}/dist-${{ matrix.platform }}.tar.gz" \
            "s3://${R2_BUCKET}/desktop-builds/${GITHUB_RUN_ID}/dist-${{ matrix.platform }}.tar.gz" \
            --endpoint-url "${R2_ENDPOINT}"

  publish-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    name: Publish release
    needs: [check-if-release, linux-arm64-build, linux-x64-build, macos-build, windows-build]
    if: needs.check-if-release.outputs.package-version != ''
    steps:
      - name: Download artifacts from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          aws s3 cp "s3://${R2_BUCKET}/desktop-builds/${GITHUB_RUN_ID}/" . \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}"
          for archive in dist-*.tar.gz; do
            name="${archive%.tar.gz}"
            mkdir -p "${name}"
            tar -xzf "${archive}" -C "${name}"
            rm "${archive}"
          done
      - name: Decode release notes
        run: |
          set -eo pipefail
          echo "${{ needs.check-if-release.outputs.release-notes }}" | base64 --decode > CHANGELOG.md
      - name: Checkout (for merge script)
        uses: actions/checkout@v6
        with:
          path: repo
      - name: Stage release artifacts
        run: |
          set -eo pipefail
          mkdir dist

          # macOS — dmg + zip per arch (zip is electron-updater's payload).
          mv dist-macos-15/*.dmg dist-macos-15/*.zip dist/
          mv dist-macos-15-intel/*.dmg dist-macos-15-intel/*.zip dist/

          # Linux — AppImage/deb already named via artifactName / electron-builder defaults.
          mv dist-linux-arm64/*.AppImage dist-linux-arm64/*.deb dist/
          mv dist-linux-x64/*.AppImage dist-linux-x64/*.deb dist-linux-x64/*.snap dist/

          # Windows — installers already named correctly via win.artifactName.
          mv dist-blacksmith-4vcpu-windows-2025/*.exe dist/
          mv dist-windows-11-arm/*.exe dist/
      - name: Merge updater metadata
        run: |
          set -eo pipefail
          # Mac: union arm64 + x64 latest-mac.yml into a single file.
          node repo/app/packages/desktop/scripts/merge-update-yml.mjs \
            dist-macos-15/latest-mac.yml \
            dist-macos-15-intel/latest-mac.yml \
            dist/latest-mac.yml
          # Windows: union x64 + arm64 latest.yml into a single file.
          node repo/app/packages/desktop/scripts/merge-update-yml.mjs \
            dist-blacksmith-4vcpu-windows-2025/latest.yml \
            dist-windows-11-arm/latest.yml \
            dist/latest.yml
          # Linux YMLs are already arch-suffixed by electron-builder; ship as-is.
          mv dist-linux-x64/latest-linux.yml dist/
          mv dist-linux-arm64/latest-linux-arm64.yml dist/
      - name: Clean staging dirs
        run: rm -rf dist-macos-15 dist-macos-15-intel dist-linux-arm64 dist-linux-x64 dist-blacksmith-4vcpu-windows-2025 dist-windows-11-arm repo
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*
          bodyFile: CHANGELOG.md
          tag: v${{ needs.check-if-release.outputs.package-version }}
          name: Infrawrench v${{ needs.check-if-release.outputs.package-version }}
      - name: Upload to apt
        run: npx workerapt-upload --repo infrawrench --dist desktop --cat stable --url https://apt.infrawrench.com/ --key ${{ secrets.APT_KEY }} dist/*.deb
