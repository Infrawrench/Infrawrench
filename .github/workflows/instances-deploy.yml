name: Deploy instances

on:
  push:
    branches: [main]
    paths:
      - "app/packages/instances/**"
      - "app/packages/analytics/**"
      # The chat's system prompt is built from the warehouse schema, and alert
      # email goes through server-core's Mailgun transport.
      - "app/packages/server-core/src/aws-pricing-warehouse/**"
      - "app/packages/server-core/src/email.ts"
      - "app/packages/server-core/src/email-html.ts"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-instances-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-instances-

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @infrawrench/instances test

      # Builds with Vite, then deploys the generated dist/server/wrangler.json,
      # which adds the Workers Cache entrypoints the ISR pages are served from.
      - name: Deploy
        run: pnpm --filter @infrawrench/instances run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # PostHog: the public project key and ingestion host, inlined at
          # build time. Unset builds without analytics.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
