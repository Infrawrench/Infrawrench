name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prettier, TypeScript, the translation checks and most packages' tests run
# on Infrawrench CI (.infrawrench/ci/test.yml). What is left here is what
# that pipeline cannot run yet.
jobs:
  # The tests that need native code, host tools, or Node where the runner's
  # Edge.js still differs: exactly the packages `.infrawrench/ci/test.yml`'s
  # `test` job leaves out, each with its reason there. Keep the two lists in
  # step.
  vitest:
    name: Vitest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Copy env.production.ts to env.ts for desktop package
        run: cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts

      - run: >-
          pnpm exec turbo run test
          --filter=./app/packages/web
          --filter=./app/packages/desktop
          --filter=./app/packages/bastion-agent
          --filter=./plugin-architecture/packages/turso
          --filter=./plugin-architecture/packages/ssh-tunnel-core
          --filter=./plugingen
          --filter=./plugin-architecture/packages/tailscale
          --filter=./plugin-architecture/packages/auth0
          --filter=./app/packages/ui
          --filter=./plugin-architecture/packages/crusoe
          --filter=./plugin-architecture/packages/wasabi
          --filter=./app/packages/server-core
          --filter=./app/packages/poller

  # The website's `astro check`; every other package's typecheck runs on
  # Infrawrench CI.
  typescript:
    name: TypeScript (website)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run typecheck --filter=@infrawrench/website

  migrations:
    name: Database migrations
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        # Match docker-compose.dev.yml (Postgres 16). Multi-arch image works on
        # ubuntu-24.04-arm. pgcrypto (used by migration 0010) is built in.
        image: postgres:16
        env:
          POSTGRES_USER: infrawrench
          POSTGRES_PASSWORD: infrawrench
          POSTGRES_DB: infrawrench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infrawrench -d infrawrench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply drizzle migrations
        run: pnpm --filter @infrawrench/web db:migrate
        env:
          DATABASE_URL: postgres://infrawrench:infrawrench@localhost:5432/infrawrench

      - name: Re-apply migrations (idempotent no-op)
        run: pnpm --filter @infrawrench/web db:migrate
        env:
          DATABASE_URL: postgres://infrawrench:infrawrench@localhost:5432/infrawrench

  db-tests:
    name: Database tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        # Match docker-compose.dev.yml (Postgres 16). Multi-arch image works on
        # ubuntu-24.04-arm. pgcrypto (used by migration 0010) is built in.
        image: postgres:16
        env:
          POSTGRES_USER: infrawrench
          POSTGRES_PASSWORD: infrawrench
          POSTGRES_DB: infrawrench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infrawrench -d infrawrench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Not a service container: those start before checkout, and ClickHouse
      # needs the repo's listen.xml (the image's default "::" listen leaves it
      # not listening at all on IPv6-less Docker networks — see
      # docker-compose.dev.yml).
      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_DB=infrawrench \
            -e CLICKHOUSE_PASSWORD=infrawrench \
            -v "$PWD/infra/docker/clickhouse/listen.xml:/etc/clickhouse-server/config.d/zz-listen.xml:ro" \
            clickhouse/clickhouse-server:24.8-alpine

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply drizzle migrations
        run: pnpm --filter @infrawrench/web db:migrate
        env:
          DATABASE_URL: postgres://infrawrench:infrawrench@localhost:5432/infrawrench

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 2
          done
          docker logs clickhouse
          exit 1

      - name: Run database tests
        run: pnpm test:db
        env:
          DATABASE_URL: postgres://infrawrench:infrawrench@localhost:5432/infrawrench
          CLICKHOUSE_METRICS_URL: http://localhost:8123
          CLICKHOUSE_METRICS_USER: default
          CLICKHOUSE_METRICS_PASSWORD: infrawrench
          CLICKHOUSE_METRICS_DATABASE: infrawrench

      - name: Shadow-run the mocked ClickHouse suites
        run: pnpm test:clickhouse:shadow
        env:
          CLICKHOUSE_METRICS_URL: http://localhost:8123
          CLICKHOUSE_METRICS_USER: default
          CLICKHOUSE_METRICS_PASSWORD: infrawrench
          CLICKHOUSE_METRICS_DATABASE: infrawrench

      - name: Shadow-run the mocked Postgres suites
        run: pnpm test:postgres:shadow
        env:
          DATABASE_URL: postgres://infrawrench:infrawrench@localhost:5432/infrawrench
