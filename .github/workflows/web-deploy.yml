name: web-deploy

# Builds commit-SHA-tagged images for web, poller, and github-watcher, pushes
# them to Artifact Registry, runs DB migrations, then points the in-cluster
# kustomize manifests at the new tag. The cluster/registry/secrets are
# provisioned by infra/terraform/gcp.
#
# Auth is keyless: GitHub's OIDC token is exchanged for a short-lived
# credential on the CI service account via Workload Identity Federation, so
# there is no GCP key in repo secrets.
#
# Required repo secrets:
#   PROD_DATABASE_URL — Neon connection string for drizzle migrations
# Required repo variables (all four are terraform outputs):
#   GCP_WORKLOAD_IDENTITY_PROVIDER — projects/.../workloadIdentityPools/.../providers/github
#   GCP_SERVICE_ACCOUNT            — infrawrench-prod-ci@<project>.iam.gserviceaccount.com
#   AR_REGISTRY                    — us-east4-docker.pkg.dev/<project>/infrawrench
#   GKE_CLUSTER                    — cluster name (default: infrawrench-prod)
#   GKE_REGION                     — cluster region (default: us-east4)

on:
  push:
    branches: [main]
    paths:
      - "app/packages/web/**"
      - "app/packages/server-core/**"
      - "app/packages/poller/**"
      - "app/packages/github-watcher/**"
      - "app/packages/ui/**"
      - "app/packages/workflow-runtime/**"
      - "plugin-architecture/**"
      - "infra/docker/**"
      - "infra/k8s/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AR_REGISTRY }}
  CLUSTER: ${{ vars.GKE_CLUSTER || 'infrawrench-prod' }}
  REGION: ${{ vars.GKE_REGION || 'us-east4' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    # id-token lets the job mint the OIDC assertion Workload Identity
    # Federation trades for GCP credentials.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service: web
            package: "@infrawrench/web"
            app_dir: app/packages/web
          - service: poller
            package: "@infrawrench/poller"
            app_dir: app/packages/poller
          - service: github-watcher
            package: "@infrawrench/github-watcher"
            app_dir: app/packages/github-watcher
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}:${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.app_dir }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pinned pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run drizzle migrations
        run: pnpm --filter @infrawrench/web db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # gke-gcloud-auth-plugin is what kubectl shells out to for GKE tokens;
      # without it get-credentials writes a kubeconfig kubectl can't use.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Fetch cluster credentials
        run: gcloud container clusters get-credentials "$CLUSTER" --region "$REGION"

      - name: Point manifests at ${{ github.sha }}
        working-directory: infra/k8s
        run: |
          for svc in web poller github-watcher; do
            kustomize edit set image \
              "REGION-docker.pkg.dev/PROJECT_ID/infrawrench/${svc}=${REGISTRY}/${svc}:${GITHUB_SHA}"
          done

      - name: Apply manifests
        run: kubectl apply -k infra/k8s

      - name: Wait for rollouts
        run: |
          kubectl -n infrawrench rollout status deployment/web --timeout=300s
          kubectl -n infrawrench rollout status deployment/poller --timeout=300s
          kubectl -n infrawrench rollout status deployment/github-watcher --timeout=300s
