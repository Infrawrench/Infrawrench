name: web-deploy

# Builds commit-SHA-tagged images for web, poller, and github-watcher, pushes
# them to Artifact Registry, runs DB migrations, then points the in-cluster
# kustomize manifests at the new tag. The cluster/registry/secrets are
# provisioned by infra/terraform.
#
# Auth is keyless: GitHub's OIDC token is exchanged for a short-lived
# credential on the CI service account via Workload Identity Federation, so
# there is no GCP key in repo secrets.
#
# Every job runs under the `production` GitHub environment and only from main.
# The CI service account's Workload Identity condition (infra/terraform/ci.tf)
# requires both the main ref and that environment, so no other branch can mint
# GCP credentials; the environment's deployment branch rule (main only) keeps
# its secrets away from other branches too.
#
# Required `production` environment secrets:
#   PROD_DATABASE_URL — Neon connection string for drizzle migrations
# Required repo variables (all four are terraform outputs):
#   GCP_WORKLOAD_IDENTITY_PROVIDER — projects/.../workloadIdentityPools/.../providers/github
#   GCP_SERVICE_ACCOUNT            — infrawrench-prod-ci@<project>.iam.gserviceaccount.com
#   AR_REGISTRY                    — us-east4-docker.pkg.dev/<project>/infrawrench
#   GKE_CLUSTER                    — cluster name (default: infrawrench-prod)
#   GKE_REGION                     — cluster region (default: us-east4)
# Optional repo variables (Cloudflare edge; see "Cloudflare edge" in
# infra/README.md):
#   EDGE_DEPLOY_ENABLED            - "true" to deploy the web and poller Workers
#                                    after the cluster rollout. Needs the
#                                    CLOUDFLARE_API_TOKEN secret and real ids in
#                                    both edge/wrangler.jsonc files.
# Optional repo variables (AWS Lambda gateway; see "Lambda gateway" in
# infra/README.md):
#   LAMBDA_DEPLOY_ENABLED          - "true" to build the Lambda image, push it
#                                    to ECR and point both functions at it.
#   LAMBDA_ECR_REPOSITORY          - terraform output lambda_ecr_repository
#   AWS_LAMBDA_CI_ROLE_ARN         - terraform output lambda_ci_role_arn
#   AWS_REGION                     - defaults to us-east-2
#   LAMBDA_FUNCTION_PREFIX         - defaults to infrawrench-prod-lambda
#                                    (terraform's "<cluster_name>-lambda")
# Optional repo variables (Oracle Cloud session gateway and github-watcher;
# see "Oracle Cloud" in infra/README.md):
#   OCI_DEPLOY_ENABLED             - "true" to copy each deploy's web (arm64)
#                                    and github-watcher images to OCIR under
#                                    the tags the VMs' agents follow.
#   OCIR_REGISTRY                  - terraform output ocir.registry
#   (secrets OCIR_USERNAME, OCIR_TOKEN in the production environment:
#   terraform output ocir.username and -raw ocir_token)
# Optional repo variables:
#   GKE_DNS_ENDPOINT               - "true" to reach the control plane through
#                                    its IAM-gated DNS endpoint instead of the
#                                    public IP. Required once terraform's
#                                    master_authorized_networks is set, since
#                                    GitHub-hosted runners have no fixed IP.

on:
  push:
    branches: [main]
    paths:
      - "app/packages/web/**"
      - "app/packages/server-core/**"
      - "app/packages/poller/**"
      - "app/packages/github-watcher/**"
      - "app/packages/ui/**"
      # Not imported by web directly, but ui and server-core both depend on it,
      # so a client-core-only change still alters what ships.
      - "app/packages/client-core/**"
      - "app/packages/workflow-runtime/**"
      - "plugin-architecture/**"
      - "infra/docker/**"
      - "infra/k8s/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AR_REGISTRY }}
  CLUSTER: ${{ vars.GKE_CLUSTER || 'infrawrench-prod' }}
  REGION: ${{ vars.GKE_REGION || 'us-east4' }}

jobs:
  build-push:
    # workflow_dispatch can target any ref; only main may deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    environment: production
    # id-token lets the job mint the OIDC assertion Workload Identity
    # Federation trades for GCP credentials.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service: web
            package: "@infrawrench/web"
            app_dir: app/packages/web
            runner: ubuntu-latest
            tag_suffix: ""
          # The Oracle Cloud session gateway runs on Ampere (arm64) VMs. Built
          # natively on an arm runner rather than under emulation.
          - service: web
            package: "@infrawrench/web"
            app_dir: app/packages/web
            runner: ubuntu-24.04-arm
            tag_suffix: "-arm64"
          - service: poller
            package: "@infrawrench/poller"
            app_dir: app/packages/poller
            runner: ubuntu-latest
            tag_suffix: ""
          - service: github-watcher
            package: "@infrawrench/github-watcher"
            app_dir: app/packages/github-watcher
            runner: ubuntu-latest
            tag_suffix: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push ${{ matrix.service }}:${{ github.sha }}${{ matrix.tag_suffix }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/service.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}${{ matrix.tag_suffix }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.app_dir }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.tag_suffix }}
          cache-to: type=gha,scope=${{ matrix.service }}${{ matrix.tag_suffix }},mode=max

  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable corepack (pinned pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run drizzle migrations
        run: pnpm --filter @infrawrench/web db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # gke-gcloud-auth-plugin is what kubectl shells out to for GKE tokens;
      # without it get-credentials writes a kubeconfig kubectl can't use.
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Fetch cluster credentials
        env:
          DNS_ENDPOINT: ${{ vars.GKE_DNS_ENDPOINT }}
        run: |
          if [ "$DNS_ENDPOINT" = "true" ]; then
            gcloud container clusters get-credentials "$CLUSTER" --region "$REGION" --dns-endpoint
          else
            gcloud container clusters get-credentials "$CLUSTER" --region "$REGION"
          fi

      - name: Point manifests at ${{ github.sha }}
        working-directory: infra/k8s
        run: |
          for svc in web poller github-watcher; do
            kustomize edit set image \
              "REGION-docker.pkg.dev/PROJECT_ID/infrawrench/${svc}=${REGISTRY}/${svc}:${GITHUB_SHA}"
          done

      - name: Apply manifests
        run: kubectl apply -k infra/k8s

      - name: Wait for rollouts
        run: |
          kubectl -n infrawrench rollout status deployment/web --timeout=300s
          kubectl -n infrawrench rollout status deployment/poller --timeout=300s
          kubectl -n infrawrench rollout status deployment/github-watcher --timeout=300s

  # The Oracle Cloud VMs (infra/terraform/oci.tf): copy this deploy's images
  # into OCIR under the tags their agents follow; each agent pulls within a
  # minute and restarts (web-2 three minutes after web-1). After `migrate`.
  deploy-oci:
    if: github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # skopeo (preinstalled on the runner) copies registry to registry
      # without pulling into a local daemon. --multi-arch all: buildx pushes a
      # manifest list (image plus attestation), and skopeo would otherwise
      # look in it for the runner's own architecture, which the arm64 web
      # build does not have.
      - name: Copy images to OCIR
        env:
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_TOKEN: ${{ secrets.OCIR_TOKEN }}
        run: |
          src_token="$(gcloud auth print-access-token)"
          copy() {
            skopeo copy --retry-times 3 --multi-arch all \
              --src-creds "oauth2accesstoken:${src_token}" \
              --dest-creds "${OCIR_USERNAME}:${OCIR_TOKEN}" \
              "docker://${REGISTRY}/$1" "docker://${OCIR_REGISTRY}/$2"
          }
          copy "web:${GITHUB_SHA}-arm64" "web:oci-arm64"
          copy "github-watcher:${GITHUB_SHA}" "github-watcher:oci"
          echo "OCIR now serves ${GITHUB_SHA}; the VMs' agents pick it up within a minute."

  # The AWS Lambda gateway: the web gateway and the poller, one image with
  # two handlers (infra/docker/lambda.Dockerfile). After `migrate` for the
  # schema, and before `deploy-edge`, so the Worker never forwards to a
  # function older than itself. Configuration is not deployed here: terraform
  # writes app_env to the Secrets Manager secret the functions read, and owns
  # every setting but the image.
  deploy-lambda:
    if: github.ref == 'refs/heads/main' && vars.LAMBDA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: production
    # id-token lets the job assume the CI role through GitHub's OIDC provider
    # (infra/terraform/lambda.tf); there is no AWS key in repo secrets.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      ECR_REPOSITORY: ${{ vars.LAMBDA_ECR_REPOSITORY }}
      FUNCTION_PREFIX: ${{ vars.LAMBDA_FUNCTION_PREFIX || 'infrawrench-prod-lambda' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable in ECR, so a re-run of the same commit reuses the
      # image it already pushed.
      - name: Check for an existing image
        id: existing
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" \
              --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.existing.outputs.found != 'true'

      # provenance off: buildx otherwise pushes an image index with an
      # attestation manifest, and Lambda accepts only a single-platform image.
      - name: Build and push lambda:${{ github.sha }}
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/lambda.Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,scope=lambda,mode=max

      # The functions exist only once terraform has been given a first image
      # tag (lambda_initial_image_tag), so on the bootstrap run this pushes
      # the image and says so instead of failing.
      - name: Point the functions at ${{ github.sha }}
        run: |
          for fn in web poller; do
            name="${FUNCTION_PREFIX}-${fn}"
            if ! aws lambda get-function --function-name "$name" >/dev/null 2>&1; then
              echo "::notice::$name does not exist yet; set lambda_initial_image_tag = \"$GITHUB_SHA\" in terraform.tfvars and apply."
              continue
            fi
            aws lambda update-function-code --function-name "$name" \
              --image-uri "${ECR_REPOSITORY}:${GITHUB_SHA}" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$name"
            echo "$name \$LATEST now runs ${GITHUB_SHA}"
          done

      # The web function's URL serves its `live` alias, from a SnapStart
      # snapshot of a published version (infra/terraform/lambda.tf). Publishing
      # runs init and takes the snapshot; the runtime refuses one that would
      # share randomness between environments (server-core lambda-snapshot.ts),
      # and then this fails with `live` still on the previous version.
      - name: Publish the web function and move live
        run: |
          name="${FUNCTION_PREFIX}-web"
          if ! aws lambda get-alias --function-name "$name" --name live >/dev/null 2>&1; then
            echo "::notice::$name has no live alias yet; the terraform apply that creates it publishes the first version."
            exit 0
          fi
          version=$(aws lambda publish-version --function-name "$name" \
            --description "${GITHUB_SHA}" --query Version --output text)
          if ! aws lambda wait published-version-active --function-name "$name" --qualifier "$version"; then
            aws lambda get-function-configuration --function-name "$name" --qualifier "$version" \
              --query '{State: State, Reason: StateReason, Code: StateReasonCode}'
            echo "::error::Version $version did not become active; live is unchanged. The init log is in /aws/lambda/$name."
            exit 1
          fi
          aws lambda update-alias --function-name "$name" --name live --function-version "$version" >/dev/null
          echo "$name:live now runs version $version (${GITHUB_SHA})"

          # Every published version keeps its snapshot, billed while it exists.
          # Keep the live one and the two before it, the rollback targets.
          aws lambda list-versions-by-function --function-name "$name" \
              --query "Versions[?Version!='\$LATEST'].Version" --output text \
            | tr '\t' '\n' | sort -n | head -n -3 \
            | while read -r old; do
                [ "$old" = "$version" ] && continue
                aws lambda delete-function --function-name "$name" --qualifier "$old"
                echo "deleted $name:$old"
              done

  # The Cloudflare edge: the web front door and the edge poller, both built
  # from this same commit. After `deploy` so the gateway (the pods above) is
  # already serving what the edge forwards to it, after `deploy-lambda` for
  # the same reason, and after `migrate` so the schema the Workers read is in
  # place. Secrets are the cluster's own `infrawrench-env` (terraform's
  # app_env, plus the Lambda's URL and shared secret), read here rather than
  # duplicated in GitHub, so the runtimes can never disagree about a value.
  deploy-edge:
    # `!failure() && !cancelled()` rather than the implicit success(): a
    # skipped deploy-lambda (the Lambda gateway not adopted) must not skip
    # this job too. deploy-oci is deliberately not a dependency: the Worker
    # does not depend on the Oracle VMs' version, and a failed copy to OCIR
    # must not hold up the edge.
    if: >-
      !failure() && !cancelled() &&
      github.ref == 'refs/heads/main' && vars.EDGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [migrate, deploy, deploy-lambda]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable corepack (pinned pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse placeholder binding ids
        run: |
          if grep -nE '"(HYPERDRIVE_ID|CLICKHOUSE_VPC_SERVICE_ID)"' \
              app/packages/web/edge/wrangler.jsonc app/packages/poller/edge/wrangler.jsonc; then
            echo "::error::Replace the placeholder ids above with the real Hyperdrive and VPC service ids (infra/README.md, Cloudflare edge)."
            exit 1
          fi

      # Workspace packages the Workers import from their built output (the
      # plugins, ui), then the SPA the web Worker serves as static assets.
      - name: Build
        run: |
          pnpm exec turbo run build --filter="@infrawrench/web^..." --filter="@infrawrench/poller^..."
          pnpm --filter @infrawrench/web build:client

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Fetch cluster credentials
        env:
          DNS_ENDPOINT: ${{ vars.GKE_DNS_ENDPOINT }}
        run: |
          if [ "$DNS_ENDPOINT" = "true" ]; then
            gcloud container clusters get-credentials "$CLUSTER" --region "$REGION" --dns-endpoint
          else
            gcloud container clusters get-credentials "$CLUSTER" --region "$REGION"
          fi

      - name: Read app_env from the cluster
        run: |
          umask 077
          kubectl -n infrawrench get secret infrawrench-env -o json \
            | jq '.data | map_values(@base64d)' > "$RUNNER_TEMP/edge-secrets.json"

      # --old-asset-ttl keeps the previous build's hashed assets servable for a
      # day, so a tab opened before the deploy can still lazy-load its chunks.
      - name: Deploy web Worker
        run: >
          pnpm --filter @infrawrench/web exec wrangler deploy -c edge/wrangler.jsonc
          --secrets-file "$RUNNER_TEMP/edge-secrets.json" --old-asset-ttl 86400
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy poller Worker
        run: >
          pnpm --filter @infrawrench/poller exec wrangler deploy -c edge/wrangler.jsonc
          --secrets-file "$RUNNER_TEMP/edge-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/edge-secrets.json"
