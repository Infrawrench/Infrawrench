name: Terraform provider (native)

# The provider's gofmt, build and tests run on Infrawrench CI
# (.infrawrench/ci/terraform-provider.yml). These two checks are left here
# because neither runs in a WebAssembly job yet:
# - go vet: vet compiled for WebAssembly traps in its errorsas and hostport
#   analyzers on this module's packages (an upstream Go bug: go.dev's own
#   toolchain does the same under wasmtime), and a `go` process there can
#   start only 511 children (#1082), fewer than `go vet ./...` needs.
# - The docs check: tfplugindocs reads the schema by running a real
#   Terraform, which loads the provider through go-plugin over a Unix domain
#   socket, and a WASIX job has no Unix domain sockets (nor a Terraform built
#   for WebAssembly).
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - "terraform-provider-infrawrench/**"
      - ".github/workflows/terraform-provider.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform-provider-infrawrench/**"
      - ".github/workflows/terraform-provider.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Vet and docs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform-provider-infrawrench
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # The single source of truth for the toolchain, so a `go` directive
          # bump does not need a second edit here.
          go-version-file: terraform-provider-infrawrench/go.mod
          cache-dependency-path: terraform-provider-infrawrench/go.sum

      # Every analyzer, as on a laptop. Infrawrench CI's `go test` runs with
      # -vet=off, so this is the module's only vet.
      - name: go vet
        run: go vet ./...

      # The Registry renders `docs/` from the release tag and nothing else. A
      # schema change that never reached the generated pages ships a provider
      # whose documentation describes the previous version, silently, because
      # the docs still exist and still look right.
      #
      # tfplugindocs drives a real Terraform to read the served schema, so it
      # needs the binary. The generator itself is pinned as a Go tool
      # dependency, so CI and a laptop produce identical bytes.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Documentation is up to date
        run: |
          set -euo pipefail
          go tool tfplugindocs generate --provider-name infrawrench
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is stale. Run: cd terraform-provider-infrawrench && go tool tfplugindocs generate --provider-name infrawrench"
            git diff --stat -- docs
            exit 1
          fi
