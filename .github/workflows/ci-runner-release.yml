name: CI runner release

# Publishes `iwci` to the runners' release channel. Bump ci-runner/VERSION
# and merge: this builds it for each target, uploads it to R2 under
# releases/iwci/<version>/<target>, signs the `stable` channel to point at
# it, and once both targets are on the channel tags ci-runner-v<version>.
# Runners following the channel (infra/ci-runners) pick it up within five
# minutes and swap themselves in place once their running jobs finish.
#
# Each target is decided on its own, from the channel rather than the tag:
# `iwci release-status` says whether the signed channel already lists that
# target for this version, and a target it lists is skipped, never rebuilt
# into the store (`iwci release` refuses different bytes for a version
# anyway). So a run that published x86_64 but not aarch64 is finished by
# running this workflow again from main (workflow_dispatch) or rerunning the
# failed job, and running it with both published changes nothing. A
# version is always built from the commit that set ci-runner/VERSION to it,
# so a later run builds the same source as the first. If the channel has
# moved on to a later version, the run publishes nothing: rolling hosts back
# is a deliberate `iwci release` by a person, not a side effect of a rerun.
on:
  push:
    branches: [main]
    paths: ["ci-runner/VERSION"]
  workflow_dispatch:

concurrency:
  group: ci-runner-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are published from main, not $GITHUB_REF." >&2
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: ci-runner/VERSION
          sparse-checkout-cone-mode: false

      - name: Read the version and the commit that set it
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < ci-runner/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ci-runner/VERSION must be a version such as 0.2.0, not '$version'" >&2
            exit 1
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=ci-runner/VERSION&sha=$GITHUB_SHA&per_page=1" --jq '.[0].sha')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not find the commit that set ci-runner/VERSION (got '$sha')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $sha, the commit that set ci-runner/VERSION."
          if git ls-remote --exit-code --tags origin "refs/tags/ci-runner-v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the publishing secrets
        env:
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          IWCI_RELEASE_SIGNING_KEY: ${{ secrets.IWCI_RELEASE_SIGNING_KEY }}
        run: |
          missing=()
          for name in IWCI_R2_ACCOUNT_ID IWCI_R2_BUCKET IWCI_R2_ACCESS_KEY_ID IWCI_R2_SECRET_ACCESS_KEY IWCI_RELEASE_SIGNING_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Set these repository secrets to publish: ${missing[*]}" >&2
            exit 1
          fi

  release:
    name: Build and publish iwci
    needs: version
    # 22.04 for its older glibc, so the binary also runs on older hosts.
    runs-on: ubuntu-22.04
    outputs:
      published: ${{ steps.status.outputs.state == 'published' || steps.publish.outcome == 'success' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          key: release

      - name: Build
        env:
          IWCI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "$IWCI_VERSION"
          cargo build --release -p iwci --features node
          test "$(./target/release/iwci version)" = "$IWCI_VERSION"

      - name: Check what the channel already has
        id: status
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          IWCI_RELEASE_SIGNING_KEY: ${{ secrets.IWCI_RELEASE_SIGNING_KEY }}
        run: |
          state="$(./target/release/iwci release-status \
            --version "$VERSION" --target x86_64-linux --channel stable \
            --cache "$RUNNER_TEMP/iwci-cache")"
          case "$state" in
            published) echo "x86_64-linux $VERSION is already on the stable channel; nothing to publish." ;;
            uploaded | absent) ;;
            superseded) echo "::warning::The stable channel is at a later version than $VERSION; not publishing x86_64-linux." ;;
            *) echo "unexpected status '$state'" >&2; exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish and point the stable channel at it
        id: publish
        if: steps.status.outputs.state == 'uploaded' || steps.status.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          IWCI_RELEASE_SIGNING_KEY: ${{ secrets.IWCI_RELEASE_SIGNING_KEY }}
        run: |
          ./target/release/iwci release ./target/release/iwci \
            --version "$VERSION" --target x86_64-linux --channel stable \
            --cache "$RUNNER_TEMP/iwci-cache"

  # The same version for ARM64 hosts (Graviton). After the x86 job, never
  # beside it: publishing a target rewrites the channel's signed manifest
  # with that target added, so two at once could drop one. Runners pick
  # their target from their own architecture, so an ARM64 host only ever
  # installs this build.
  release-arm64:
    name: Build and publish iwci (ARM64)
    needs: [version, release]
    runs-on: ubuntu-22.04-arm
    outputs:
      published: ${{ steps.status.outputs.state == 'published' || steps.publish.outcome == 'success' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-runner
          key: release-arm64

      - name: Build
        env:
          IWCI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "$IWCI_VERSION"
          cargo build --release -p iwci --features node
          test "$(./target/release/iwci version)" = "$IWCI_VERSION"

      - name: Check what the channel already has
        id: status
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          IWCI_RELEASE_SIGNING_KEY: ${{ secrets.IWCI_RELEASE_SIGNING_KEY }}
        run: |
          state="$(./target/release/iwci release-status \
            --version "$VERSION" --target aarch64-linux --channel stable \
            --cache "$RUNNER_TEMP/iwci-cache")"
          case "$state" in
            published) echo "aarch64-linux $VERSION is already on the stable channel; nothing to publish." ;;
            uploaded | absent) ;;
            superseded) echo "::warning::The stable channel is at a later version than $VERSION; not publishing aarch64-linux." ;;
            *) echo "unexpected status '$state'" >&2; exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish and add it to the stable channel
        id: publish
        if: steps.status.outputs.state == 'uploaded' || steps.status.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IWCI_R2_ACCOUNT_ID: ${{ secrets.IWCI_R2_ACCOUNT_ID }}
          IWCI_R2_BUCKET: ${{ secrets.IWCI_R2_BUCKET }}
          IWCI_R2_ACCESS_KEY_ID: ${{ secrets.IWCI_R2_ACCESS_KEY_ID }}
          IWCI_R2_SECRET_ACCESS_KEY: ${{ secrets.IWCI_R2_SECRET_ACCESS_KEY }}
          IWCI_RELEASE_SIGNING_KEY: ${{ secrets.IWCI_RELEASE_SIGNING_KEY }}
        run: |
          ./target/release/iwci release ./target/release/iwci \
            --version "$VERSION" --target aarch64-linux --channel stable \
            --cache "$RUNNER_TEMP/iwci-cache"

  # The tag says the version is out for every target, so it comes last, and
  # only when both jobs ended with their target on the channel. It marks the
  # commit the binaries were built from.
  tag:
    name: Tag the release
    needs: [version, release, release-arm64]
    if: >-
      needs.version.outputs.tagged != 'true' &&
      needs.release.outputs.published == 'true' &&
      needs.release-arm64.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: ci-runner/VERSION
          sparse-checkout-cone-mode: false

      - name: Tag the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          git tag "ci-runner-v$VERSION" "$SHA"
          git push origin "ci-runner-v$VERSION"
