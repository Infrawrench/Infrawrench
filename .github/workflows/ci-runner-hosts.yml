name: CI runner hosts

# infra/ci-runners/ is Terraform and the shell scripts it installs on the
# runner hosts; nothing else checks it. Its scripts run as root on hosts that
# serve every run, so they are linted, and the sizing script's rule is tested
# against made-up hosts (nothing is applied to the machine running it).
#
# The two path lists are duplicated because GitHub Actions does not support
# YAML anchors in workflow files. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - "infra/ci-runners/**"
      - ".github/workflows/ci-runner-hosts.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/ci-runners/**"
      - ".github/workflows/ci-runner-hosts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Shellcheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra/ci-runners
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: shellcheck
        run: shellcheck files/install.sh files/iwci-size tests/*.sh

      - name: iwci-size
        run: bash tests/iwci-size.sh
