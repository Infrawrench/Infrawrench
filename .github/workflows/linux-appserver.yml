name: Linux app server

# `linux-appserver/` is a standalone Rust workspace outside the pnpm workspace,
# so nothing in test.yml reaches it. This is its whole CI.
#
# The two path lists are duplicated because GitHub Actions does not support YAML
# anchors in workflow files. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - "linux-appserver/**"
      - ".github/workflows/linux-appserver.yml"
  pull_request:
    branches: [main]
    paths:
      - "linux-appserver/**"
      - ".github/workflows/linux-appserver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linux-appserver
    steps:
      - uses: actions/checkout@v6

      # The toolchain file is the single source of truth for the version, so a
      # bump does not need a second edit here.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-appserver

      # Formatting first: cheapest check, most likely to fail.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  musl:
    name: Static build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      # Built inside Alpine rather than with a musl cross-toolchain, because
      # the compositor links libxkbcommon and a static build needs a musl
      # build of it. Debian and the cross images ship only the glibc one, so
      # the link fails with `cannot find -lxkbcommon`; Alpine packages
      # libxkbcommon-static and every arch runs natively on its own runner.
      #
      # `docker run` rather than the job-level `container:` key: actions/checkout
      # needs a glibc node to run, which an Alpine container does not have.
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD/linux-appserver:/src" -w /src alpine:3.22 sh -euc '
            apk add --no-cache curl gcc musl-dev libxkbcommon-dev libxkbcommon-static file
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal
            export PATH=/root/.cargo/bin:$PATH
            cargo build --release --target ${{ matrix.target }} -p iwappd

            binary=target/${{ matrix.target }}/release/iwappd
            file "$binary"
            # A dynamically linked "static" build fails only on the target
            # host, days later, so assert it here instead.
            if file "$binary" | grep -q "dynamically linked"; then
              echo "::error::$binary is dynamically linked; it must be static to run on an unknown host"
              exit 1
            fi
            ls -lh "$binary"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: iwappd-${{ matrix.target }}
          path: linux-appserver/target/${{ matrix.target }}/release/iwappd
          if-no-files-found: error
