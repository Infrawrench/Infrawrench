# Release build for the Terraform Registry.
#
# This file runs in the *satellite* repository (Infrawrench/terraform-provider-
# infrawrench), not here — the monorepo mirrors this directory there and pushes
# a tag, and the satellite's own release workflow invokes GoReleaser. It lives
# here because this is where the provider's source lives, and a build config
# that drifts from the code it builds is worse than no config.
#
# The Registry's ingestion is strict about names. It looks for
# `terraform-provider-{NAME}_{VERSION}_{OS}_{ARCH}.zip`, a `_SHA256SUMS` file,
# a detached `_SHA256SUMS.sig`, and `{NAME}_{VERSION}_manifest.json`. Every
# `name_template` below exists to produce exactly those strings — none of it is
# stylistic, and a "tidier" template silently produces a release the Registry
# ignores.
version: 2

# Stated rather than inferred, and that matters more than it looks.
#
# GoReleaser defaults ProjectName to the repository name, which in the satellite
# happens to be right — so every `name_template` below quietly depended on the
# satellite being called `terraform-provider-infrawrench` and on nobody ever
# building from anywhere else. Run from the monorepo it resolves to
# `Infrawrench`, and every artifact comes out under a name the Registry does not
# recognise.
#
# Pinning it makes the naming contract a property of this file instead of a
# property of the checkout, which is also what lets the monorepo dry-run a
# release and check the names it will actually publish under.
project_name: terraform-provider-infrawrench

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # A provider is executed by Terraform as a plugin subprocess on whatever
      # machine runs the plan. Static linking is what makes one artifact work
      # across the glibc/musl split.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # main.version is what the provider reports to Terraform and stamps into
      # its User-Agent, so a bug report names a build rather than "dev".
      - "-s -w -X main.version={{.Version}}"
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    ignore:
      # Combinations Terraform does not ship for, and nobody can run.
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  # The manifest has to be listed here *as well as* under `release` below, and
  # the duplication is the whole point rather than an oversight.
  #
  # `release.extra_files` attaches a file to the GitHub release; it does not
  # feed the checksum step, which by default only sees the archives GoReleaser
  # built. Declaring the manifest in one place and not the other produces a
  # release that looks complete — the file is right there — and that the
  # Registry rejects with "missing SHA256 checksum for
  # terraform-provider-infrawrench_X_manifest.json", because it verifies every
  # asset it ingests against _SHA256SUMS and will not take one on trust.
  #
  # Keep the glob and name_template identical in both blocks. A mismatch
  # checksums a name nothing was published under, which fails the same way.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # The Registry verifies this detached signature against the public key
      # registered with the namespace, which is how it knows a release came
      # from us. GPG_FINGERPRINT selects the key; the passphrase arrives on
      # stdin so it never reaches the process table.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      # Renamed on the way out: the file is committed under a fixed name so the
      # repository reads clearly, and published under the versioned one the
      # Registry looks for. ProjectName resolves to the repository name, which
      # is why the satellite has to be called terraform-provider-infrawrench.
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
