[workspace]
resolver = "3"
members = ["crates/iw-proto", "crates/iw-codec", "crates/iw-apps", "crates/iwappd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"
publish = false

[workspace.dependencies]
iw-proto = { path = "crates/iw-proto" }
iw-codec = { path = "crates/iw-codec" }
iw-apps = { path = "crates/iw-apps" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zstd = "0.13"

[profile.release]
# The binary is uploaded to every host the user connects to, so size is a
# feature. LTO + one codegen unit + no unwinding tables costs build time we
# only pay in CI.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
