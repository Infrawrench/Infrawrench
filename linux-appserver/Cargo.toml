[workspace]
resolver = "3"
members = ["crates/iw-proto", "crates/iw-codec", "crates/iw-apps", "crates/iwappd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"
publish = false

[workspace.dependencies]
iw-proto = { path = "crates/iw-proto" }
iw-codec = { path = "crates/iw-codec" }
iw-apps = { path = "crates/iw-apps" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zstd = "0.13"
# Baseline JPEG for the lossy tier. Zero transitive dependencies, no unsafe
# with default features off, and the browser decodes the result natively —
# which is the argument for JPEG over anything we would have to ship a decoder
# for. 0.6 rather than 0.7 because 0.7 wants rustc 1.87 and this workspace is
# pinned to 1.85.
jpeg-encoder = { version = "0.6.1", default-features = false }

[profile.release]
# The binary is uploaded to every host the user connects to, so size is a
# feature. LTO + one codegen unit + no unwinding tables costs build time we
# only pay in CI.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
