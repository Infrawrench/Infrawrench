name: napi-wasmer-v8

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  v8-native-linux:
    name: v8-native-linux-${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build native V8 N-API
        run: make build-napi CMAKE_BUILD_TYPE=${{ matrix.build_type }} JOBS=4

      - name: Test native V8 N-API
        run: make test-napi CMAKE_BUILD_TYPE=${{ matrix.build_type }} JOBS=4 TEST_JOBS=4

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  v8-native-macos:
    name: v8-native-macos-${{ matrix.build_type }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build native V8 N-API
        run: make build-napi CMAKE_BUILD_TYPE=${{ matrix.build_type }} JOBS=4

      - name: Test native V8 N-API
        run: make test-napi CMAKE_BUILD_TYPE=${{ matrix.build_type }} JOBS=4 TEST_JOBS=4

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

