[package]
name = "wasmer-napi"
version = "0.705.0"
description = "NAPI library for Wasmer WebAssembly runtime"
edition = "2024"
license = "MIT"
resolver = "2"

[features]
js = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "wasmer/experimental-async",
  "wasmer/js-default",
]
# Implements the WASIX runtime's `InstantiationHook` for `NapiRuntimeHooks`.
# `wasmer-wasix` is a non-optional dependency (the always-compiled guest callback
# trampoline needs `WasiError`), so this feature only gates `mod wasix` and does
# not activate the dependency.
wasix = []
cli = [
  "wasix",
  "dep:wasmer-cache",
  "dep:wasmer-c-api-imports",
  "wasmer-c-api-imports/wasi",
  "dep:tokio",
  "dep:virtual-fs",
  "dep:wasmer-types",
]

[dependencies]
anyhow = "1"
# Standalone builds use one immutable Wasmer source revision. The N-API
# instantiation hook and shared-memory bridge are developed together on the SDK
# branch, so mixing this source with crates.io lacks required APIs.
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", default-features = false }

# This dependencies are ONLY needed for testing napi in Wasm locally
wasmer-cache = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", optional = true }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", optional = true, default-features = false }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", optional = true }
# Non-optional: `mod guest` (always compiled) re-raises guest WASI process
# exits through the N-API import layers and needs the WASIX error type.
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
enum-iterator = "2.3.0"
offset-allocator = "0.2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", default-features = false, features = [
  "js",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", default-features = false, features = [
  "sys-default",
] }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "c83ba6d315d051739339636da7080ed5987845de", default-features = false, features = [
  "sys",
] }

[build-dependencies]
cc = "1"
tar = "0.4"
ureq = "2"
xz = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[[bin]]
name = "napi_wasmer"
path = "src/bin/napi_wasmer.rs"
required-features = ["cli"]

# Keep this manifest independent when cargo-standalone.sh materializes it in a
# temporary directory below a larger checkout that also has a Cargo workspace.
[workspace]
