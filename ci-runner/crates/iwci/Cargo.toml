[package]
name = "iwci"
description = "The CI runner: plans a commit's pipelines and runs every job in a Wasmer isolate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `env:bash-node`: Edge.js imports N-API from the host, which the runtime
# provides with V8 (a prebuilt V8 its build script downloads).
node = ["iwci-runtime/node"]

[dependencies]
iwci-spec.workspace = true
iwci-vfs.workspace = true
iwci-store.workspace = true
iwci-runtime.workspace = true
iwci-git.workspace = true
iwci-deps.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
globset.workspace = true
# Only to size the global pool Wasmer compiles on (`--cpus`).
rayon = "1"
# `iwci serve`: a small synchronous HTTP server; each request gets a thread,
# as runs already do.
tiny_http = "0.12"
# Releases: channel manifests are signed (Ed25519) so a host's own store
# credentials cannot push a binary to the other hosts; keys are base64.
ed25519-dalek = "3"
base64 = "0.22"
getrandom = "0.3"
# Draining on SIGTERM instead of dying with running jobs. Both are already
# in the tree through tokio.
libc = "0.2"
signal-hook-registry = "1"
# Job caches are stored as one zstd stream each.
zstd = { version = "0.13", default-features = false }
