[package]
name = "iwci-vm-proto"
description = "The wire between the runner and the agent inside a job's virtual machine (`platform: linux` and `platform: windows`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built into the runner and into the guest agent, which runs on Linux and
# on Windows on Arm: keep it to what both build without a C toolchain.
[dependencies]
serde.workspace = true
serde_json.workspace = true
# `.gitignore` rules, which the runner and the agent both judge a job's new
# files by (`gitignore`). Pure Rust, and already in the tree through gix.
gix-ignore = "0.24.1"
gix-glob = "0.29.1"
bstr = { version = "1.12", default-features = false, features = ["std"] }
