[package]
name = "iwci-runtime"
description = "Runs CI jobs as WebAssembly isolates: module cache, WASI commands, the tsc host and WASIX environments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Edge.js (node, npm, pnpm) imports N-API from the host. wasmer-napi provides
# it on top of V8, which is a large native build, so it is opt in.
node = ["dep:wasmer-napi"]

[dependencies]
iwci-vfs.workspace = true
# `experimental-host-interrupt` is what lets a watchdog thread stop a guest
# that is spinning in compiled code without making a single host call.
wasmer = { workspace = true, features = ["experimental-host-interrupt"] }
# wasmer-wasix refuses to build without one of `sys`, `js` or `sys-minimal`.
# `sys-minimal` is the one without host networking, host file system access
# or an HTTP client.
wasmer-wasix = { workspace = true, features = ["sys-minimal"] }
# Host sockets for a job's outbound connections (network.rs), taken from
# virtual-net directly: wasmer-wasix's own `host-vnet` would make every
# job's runtime build a host network of its own (a selector thread each,
# and a panic outside a tokio context) only for us to replace it.
virtual-net = { version = "0.705.0", default-features = false, features = ["host-net"] }
virtual-fs.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
futures.workspace = true
# getifaddrs, for the host's own addresses (network.rs). Already in the tree.
libc = "0.2"
# wasmer-wasix describes its syscalls and signal deliveries through `tracing`,
# which signals.rs subscribes to. Already in the tree.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The versions below are the ones wasmer-wasix itself pins or resolves, named
# here because their types appear in the traits this crate implements.
wasmer-types = "=7.5.0"
wasmer-config = "=0.705.0"
# webc's annotations are CBOR values; rewriting a command's `wasi.env`
# (see `command_env_as_defaults`) builds one.
ciborium = "0.2"
webc = { version = "=12.0.1", default-features = false, features = ["v2", "v3"] }
tokio = { version = "1.39", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
anyhow = "1"
async-trait = "0.1"
url = "2"
bytes = "1.9"
getrandom = "0.3"
# How wasmer-wasix numbers inodes, which `/proc/iwci/ino/` has to match
# (modes.rs `ino_of`). Already in the tree, through wasmer-wasix.
xxhash-rust = { version = "0.8.10", default-features = false, features = ["xxh64"] }
wasmer-napi = { version = "=0.705.0", features = ["wasix"], optional = true }

[dev-dependencies]
serde_json.workspace = true
wat = "1"
