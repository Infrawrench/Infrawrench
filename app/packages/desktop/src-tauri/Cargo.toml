[package]
name = "infrawrench-desktop"
version = "0.1.0"
description = "Infrawrench Desktop"
authors = ["Infrawrench"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
anyhow = "1"
sqlx = { version = "0.8.6", features = ["postgres", "mysql", "runtime-tokio-native-tls", "json"] }
url = "2.5.8"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
