# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# The Terraform provider (terraform-provider-infrawrench/), a standalone Go
# module outside the pnpm workspace, so nothing in test.yml reaches it. A
# pipeline of its own keeps it that way.
#
# Two checks run on a machine (`platform: linux`) rather than in an isolate,
# in the `native` job:
# - `go vet`: vet compiled for WebAssembly traps in its errorsas and hostport
#   analyzers on this module's packages, an upstream Go bug (it does the same
#   under wasmtime with go.dev's own toolchain). Rechecked on runner 0.3.32
#   with env:go 1.27 (Go 1.27.4): still so, while every other analyzer passes
#   now that #1082 is fixed. Those two are the reason vet is native.
# - The docs check: tfplugindocs reads the schema by running a real
#   Terraform, which loads the provider through go-plugin over a Unix domain
#   socket, and WASIX has no Unix domain sockets.
name: Terraform provider

# The checked-in spec is an input as well as the module: the wire drift test
# reads it and fails when a schema property is neither decoded nor excused,
# so a spec regeneration can break this module without touching a file in it.
on:
  push:
    branches: [main]
    paths: &paths
      - terraform-provider-infrawrench/**
      - app/packages/web/openapi.json
      - .infrawrench/ci/terraform-provider.yml
      # Where the `native` job gets Terraform.
      - .infrawrench/ci/git-tools.sh
  pull-request:
    paths: *paths

workspace:
  deps:
    - go: { dir: terraform-provider-infrawrench }

jobs:
  # `gofmt -l` exits 0 whatever it finds, so the file list has to be turned
  # into the failure itself.
  gofmt:
    name: gofmt
    using: env:go@1.27
    cwd: /app/terraform-provider-infrawrench
    deps: false
    network: false
    run: |
      unformatted="$(gofmt -l .)"
      if [ -n "$unformatted" ]; then
        echo "These files are not gofmt'd:"
        echo "$unformatted"
        echo
        echo "Run: cd terraform-provider-infrawrench && gofmt -w ."
        exit 1
      fi
    task-cache: { inputs: [terraform-provider-infrawrench/**/*.go] }
    timeout: 5m
    memory: 1GiB

  # Acceptance tests are skipped without TF_ACC, which is deliberate: they
  # create and destroy real objects in a real organization. `-count=1`
  # defeats Go's test cache, so a run that is not a task-cache hit always
  # runs the tests against this commit. `-vet=off` because vet runs in
  # `native` (below); `go test`'s own vet includes errorsas.
  #
  # Go compiles one package at a time here, so most of a cold run is
  # compiling the dependencies. From `env:go` 1.27.6 the environment keeps
  # the build cache between runs on its own (ci-runner/README.md,
  # "Environment caches"), so a run compiles only what changed.
  go:
    name: Build and test
    using: env:go@1.27
    cwd: /app/terraform-provider-infrawrench
    network: false
    run: |
      go build ./...
      go test -vet=off -count=1 ./...
    task-cache:
      inputs:
        - terraform-provider-infrawrench/**
        - app/packages/web/openapi.json
        - .infrawrench/ci/terraform-provider.yml
    timeout: 20m
    memory: 4GiB

  # Every analyzer, as on a laptop: `go`'s `go test` runs with -vet=off, so
  # this is the module's only vet. Then the docs: the Registry renders
  # `docs/` from the release tag and nothing else, so a schema change that
  # never reached the generated pages ships a provider whose documentation
  # describes the previous version, silently. The generator is pinned as a
  # Go tool dependency, so CI and a laptop produce identical bytes, and it
  # drives a real Terraform (git-tools.sh fetches it, checked against
  # HashiCorp's sum). The checkout has no .git, so the comparison is against
  # a copy taken before generating.
  native:
    name: Vet and docs
    platform: linux
    cwd: /app/terraform-provider-infrawrench
    paths:
      - terraform-provider-infrawrench/**
      - .infrawrench/ci/terraform-provider.yml
      - .infrawrench/ci/git-tools.sh
    cache:
      - key: terraform-provider-go-${{ hashFiles('terraform-provider-infrawrench/go.sum') }}
        restore-keys: ["terraform-provider-go-"]
        paths: [/root/.cache/go-mod, /root/.cache/go-build]
      - key: git-tools-${{ hashFiles('.infrawrench/ci/git-tools.sh') }}
        paths: [/root/.cache/git-forge-tools]
    env:
      GOMODCACHE: /root/.cache/go-mod
      GOCACHE: /root/.cache/go-build
    run: |
      tools=/root/.cache/git-forge-tools
      /app/.infrawrench/ci/git-tools.sh "$tools" terraform
      export PATH="$tools/bin:$PATH"
      go version

      go vet ./...

      cp -R docs /tmp/docs-before
      go tool tfplugindocs generate --provider-name infrawrench
      if ! diff -r /tmp/docs-before docs >/tmp/docs.diff; then
        echo "docs/ is stale. Run: cd terraform-provider-infrawrench && go tool tfplugindocs generate --provider-name infrawrench"
        head -n 200 /tmp/docs.diff
        exit 1
      fi
    cpus: 4
    memory: 8GiB
    timeout: 20m
