# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# Splits each new bundle the instances-bundler publishes to R2 (an AWS price
# list per platform, plus EC2 spot prices, RunPod, Alibaba Cloud ECS, Azure
# VMs, Google Cloud Compute Engine, Hetzner, OVHcloud, Oracle Cloud and IBM
# Cloud) into one Workers KV value per instance, for `/api/v1/aws-bulk-pricing`
# (see app/packages/web/src/aws-bulk-pricing), and loads the same bundles into
# the instance pricing warehouse, the ClickHouse database
# instances.infrawrench.com's chat queries (src/aws-bulk-pricing/warehouse.ts).
# It also merges AWS's public Health Dashboard feeds into the warehouse's
# `service_events` table (src/aws-bulk-pricing/service-events.ts).
#
# It runs here rather than in a Worker because an EC2 bundle is over 200 MB
# of JSON. A run where no bundle has moved reads twenty-three small `latest`
# objects, twenty-three KV keys and two warehouse tables, fetches three small
# public AWS feeds, and writes nothing unless an AWS event is new or updated.
#
# A machine (`platform: linux`), since the script reads R2 with the AWS CLI
# (aws-cli.sh installs a pinned one) and holds a whole bundle in memory.
#
# KV is written with the Infrawrench CF connection (CLOUDFLARE_API_TOKEN),
# lent to this repository's main branch, which is what a scheduled run
# checks out. The account and namespace are named here, because they are
# Infrawrench Production's and the ones the web Worker binds
# (app/packages/web/edge/wrangler.jsonc), whatever the connection's default.
#
# Notable changes (new types, retirements, big price moves, new regions) are
# printed; set the variable SOCIAL_POST to 1 to post them as well, to
# whichever of Bluesky and X has its secrets set (src/aws-bulk-pricing/social.ts).
name: Sync AWS bulk pricing data

on:
  schedule:
    - cron: "17,47 * * * *"
  # For a first load or a reload after a warehouse schema change.
  manual: {}

concurrency:
  group: aws-bulk-pricing-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync R2 bundles to KV
    platform: linux
    connections: [Infrawrench CF]
    cache:
      - key: aws-bulk-pricing-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ["aws-bulk-pricing-pnpm-"]
        paths: [/root/.cache/pnpm-store]
      - key: aws-cli-${{ hashFiles('.infrawrench/ci/aws-cli.sh') }}
        paths: [/root/.cache/aws-cli]
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      INSTANCES_BUNDLES_BUCKET: instances-bundles
      CLOUDFLARE_ACCOUNT_ID: 906034adfe1c457d2388331e220efcc7
      AWS_BULK_PRICING_KV_NAMESPACE_ID: 4baca4fd13ec4d4684d41e761f52af01
      # The pricing warehouse (CloudHouse) and a token that can write.
      # Without the secret the sync skips it and only writes KV.
      PRICING_WAREHOUSE_URL: https://instances-clickhouse.infrawrench.com/
      PRICING_WAREHOUSE_TOKEN: ${{ secrets.PRICING_WAREHOUSE_TOKEN }}
      # Told after a warehouse load so the site can email alert subscribers;
      # the same value is the instances Worker's NOTIFY_SECRET.
      INSTANCES_NOTIFY_URL: https://instances.infrawrench.com/api/internal/notify
      INSTANCES_NOTIFY_SECRET: ${{ secrets.INSTANCES_NOTIFY_SECRET }}
      SOCIAL_POST: ${{ vars.SOCIAL_POST }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    run: |
      .infrawrench/ci/aws-cli.sh /root/.cache/aws-cli
      export PATH="/root/.cache/aws-cli/bin:$PATH"

      pnpm install --frozen-lockfile --store-dir /root/.cache/pnpm-store \
        --filter . --filter "@infrawrench/web..."
      # The warehouse schema and query code in server-core import
      # @infrawrench/client-core, which resolves through its built dist.
      pnpm exec turbo run build --filter=@infrawrench/client-core --output-logs=errors-only

      pnpm --filter @infrawrench/web sync:aws-bulk-pricing
    # A first warehouse load of every bundle takes most of an hour (EC2 and
    # spot are millions of rows each); an ordinary run with one new bundle
    # is minutes.
    timeout: 90m
    cpus: 2
    memory: 12GiB
