# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# Deploys the telemetry Worker (app/packages/telemetry).
#
# A pull request builds the Worker the way a deploy would and uploads
# nothing (`wrangler deploy --dry-run`), with no credentials. A push to main
# deploys it with the Infrawrench CF connection lent to the job
# (`connections:`, which sets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID). That connection is lent to this repository's main
# branch only, so the deploy job cannot run anywhere else.
#
# `builtin:wrangler` is Wrangler on the environment's node, bundling with
# esbuild-wasm (ci-runner/README.md, "Deployment CLIs"): the package's own
# Wrangler loads workerd, which has no WebAssembly build.
name: Deploy telemetry

on:
  push:
    branches: [main]
    paths: &inputs
      - app/packages/telemetry/**
      - pnpm-lock.yaml
      - .infrawrench/ci/telemetry-deploy.yml
  pull-request:
    paths: *inputs

concurrency:
  group: telemetry-deploy-${{ commit.branch }}
  cancel-in-progress: true

workspace:
  deps:
    - pnpm: { only: [app/packages/telemetry] }

jobs:
  dry-run:
    name: Build (dry run)
    if: event == 'pull-request'
    using: env:bash-node@24.0.18
    tools: [builtin:wrangler@4]
    cwd: /app/app/packages/telemetry
    run: wrangler deploy --dry-run
    memory: 2GiB
    timeout: 10m

  deploy:
    name: Deploy to Cloudflare
    if: event == 'push'
    using: env:bash-node@24.0.18
    tools: [builtin:wrangler@4]
    connections: [Infrawrench CF]
    cwd: /app/app/packages/telemetry
    run: wrangler deploy
    memory: 2GiB
    timeout: 10m
