# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# test.yml (the GitHub Actions workflow) on Infrawrench CI: everything in it
# that runs on Node alone.
#
# - Prettier: `pnpm format:check`, one job per workspace package.
# - TypeScript: `pnpm typecheck`. turbo builds every library's dist/ with
#   tsdown first, and tsdown is a native binary the isolate cannot run, so
#   each library is typechecked by tsc-rs with --emitDeclarationOnly into
#   dist/ after the libraries it depends on (turbo's `dependsOn: ["^build"]`),
#   and its dist/ is handed on to everything downstream.
# - Translations: `translations:audit` and `translations:status`.
# - Vitest: `pnpm test`, one job per package, against the JavaScript of the
#   packages it depends on, which tsdown builds as turbo would (`bundle`);
#   tsc-rs writes their declarations (`build`), since tsdown's declaration
#   bundler has no WebAssembly build.
#
# Every job is task-cached: one whose files, the shared config and what it
# is handed have not changed since a passing run is not run again.
#
# rolldown (under Vite, Vitest and tsdown) runs as its wasm32-wasi build:
# the runner installs the WebAssembly builds of native packages and gives
# Node a working `node:wasi`. rolldown leaves that build out of its own
# optional dependencies, so the root package.json lists it.
#
# Still on GitHub Actions only (.github/workflows/test.yml):
# - Database migrations and database tests: they need Postgres and
#   ClickHouse services, which a job cannot start.
name: Test

on:
  push:
    branches: [main]
  pull-request: {}

# Every package's declarations are kept for the run.
scratch: 2GiB

workspace:
  deps:
    - pnpm

jobs:
  # What the packages' typecheck scripts do before tsc: desktop's
  # scripts/ensure-env.mjs copies env.example.ts to env.ts, and mobile's
  # scripts/build-terminal-html.mjs writes a generated module with esbuild (a
  # native binary); the typecheck only reads that module's type, a string.
  prep:
    name: Prepare generated files
    using: env:bash-node@24
    deps: false
    artifacts:
      - app/packages
      - plugin-architecture/packages
    run: |
      cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts
      mkdir -p app/packages/mobile/assets/generated
      echo 'export const terminalHtml: string = "";' > app/packages/mobile/assets/generated/terminal-html.ts

  # Each library's JavaScript, as `pnpm build` writes it, for the tests of
  # the packages that use it. Declarations are `build`'s.
  # Each waits for the libraries it depends on, though tsdown does not read
  # them: that is what hands every library's dist/ down the whole chain, so
  # a test two levels up still has plugin-base's.
  bundle:
    name: Bundle ${{ package.name }}
    packages: { scripts: { build: "tsdown*" } }
    needs: ["^bundle"]
    using: env:bash-node@24
    run: node node_modules/tsdown/dist/run.mjs --no-dts
    artifacts: [dist]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 3GiB
    timeout: 20m

  # Each package's `test` script, with the JavaScript of everything it
  # depends on. The runner's installer writes no node_modules/.bin, so
  # `vitest` in the script runs as its entry point.
  #
  # Every package's: plugingen's run real git, which every environment has
  # (ci-runner/README.md, "Git"). A package taken off this job goes back on
  # GitHub Actions, in a Vitest job of test.yml's that runs exactly the
  # packages left out here.
  #
  # Native code with no WebAssembly build in the same package, and what the
  # runner's Node does not do yet:
  # - node-preload.cjs, beside this file, hands a package that lists
  #   `@rollup/wasm-node` or `esbuild-wasm` that build in place of Rollup's
  #   or esbuild's, which Vite 6 (web's and desktop's Vitest) loads before
  #   it reads the package's config; and answers for node-pty, which tests
  #   import without opening a terminal (stubs/). bastion-agent's bundle
  #   test picks `esbuild-wasm` itself.
  # - libsql's addon: turso's test mocks the client it never makes, and
  #   server-core, poller, web and desktop swap it for the client's
  #   addon-free entry in their vitest.config.ts.
  # - Electron, whose install script never runs here: desktop's
  #   vitest.config.ts gives `require("electron")` a path to answer with.
  test:
    name: Test ${{ package.name }}
    packages:
      scripts: { test: "*vitest run*" }
    needs: [prep, bundle, "^bundle"]
    using: env:bash-node@24
    env:
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    run: |
      script="$(node -p 'require("./package.json").scripts.test')"
      eval "${script//vitest run/node node_modules/vitest/vitest.mjs run --maxWorkers=2}"
    task-cache:
      root-inputs: [tsconfig.base.json, .infrawrench/ci/node-preload.cjs, .infrawrench/ci/stubs/**]
    memory: 6GiB
    # server-core and ui take five to nine minutes each on a busy runner.
    timeout: 30m

  # Each library, after the libraries it depends on.
  build:
    name: Library ${{ package.name }}
    packages: { scripts: { build: "tsdown*" } }
    needs: [prep, "^build"]
    using: builtin:typescript@7.1
    args:
      [
        --noEmit,
        "false",
        --emitDeclarationOnly,
        --declaration,
        --declarationMap,
        "false",
        --rootDir,
        src,
        --outDir,
        dist,
      ]
    artifacts: [dist]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 3GiB
    timeout: 20m

  # Every other package whose typecheck is plain `tsc --noEmit`, against the
  # declarations of what it depends on.
  check:
    name: Typecheck ${{ package.name }}
    packages:
      scripts: { build: "!tsdown*", typecheck: "tsc --noEmit*" }
    needs: [prep, "^build"]
    using: builtin:typescript@7.1
    args: [--noEmit, -p, .]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 6GiB
    timeout: 30m

  # The Worker entry points (`tsc --noEmit -p edge`).
  edge:
    name: Typecheck ${{ package.name }} (edge)
    packages:
      has: [edge]
      scripts: { typecheck: "*tsc --noEmit -p edge*" }
    needs: [prep, "^build"]
    using: builtin:typescript@7.1
    args: [--noEmit, -p, edge]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 6GiB
    timeout: 30m

  # Desktop's typecheck runs ensure-env first (prep does that), then two
  # projects.
  desktop:
    name: Typecheck desktop (${{ matrix }})
    matrix: [tsconfig.node.json, tsconfig.web.json]
    needs: [prep, build]
    using: builtin:typescript@7.1
    cwd: /app/app/packages/desktop
    args: [--noEmit, -p, "${{ matrix }}"]
    task-cache:
      inputs: [app/packages/desktop/**]
      root-inputs: [tsconfig.base.json]
    memory: 6GiB
    timeout: 30m

  # The packages that pin TypeScript 6 (mobile, plugingen, website) run
  # their own compiler, which is JavaScript, under Node.
  mobile:
    name: Typecheck mobile (TypeScript 6)
    needs: [prep, build]
    using: env:bash-node@24
    cwd: /app/app/packages/mobile
    # The runner's installer writes no node_modules/.bin, so the package's
    # own entry point, as `tsc6` would run it.
    run: node node_modules/typescript/bin/tsc6 --noEmit
    task-cache:
      inputs: [app/packages/mobile/**]
      root-inputs: [tsconfig.base.json]
    memory: 6GiB
    timeout: 30m

  plugingen:
    name: Typecheck plugingen (TypeScript 6)
    using: env:bash-node@24
    cwd: /app/plugingen
    run: node node_modules/typescript/bin/tsc6 --noEmit
    task-cache: { inputs: [plugingen/**] }
    memory: 4GiB
    timeout: 20m

  # `astro check`: `astro sync` writes the content collections' types into
  # .astro/, then @astrojs/check runs the website's TypeScript over the
  # .astro and .ts files. The only workspace package it reads is
  # analytics, which ships its source. Loading astro.config.mjs loads the
  # Cloudflare adapter and so workerd, which has no WebAssembly build and is
  # never started here, and Tailwind's Lightning CSS, whose WebAssembly
  # build the website lists: node-preload.cjs answers for both. Astro keeps its
  # telemetry settings under HOME, which a job's environment does not set.
  website:
    name: Typecheck website (astro check)
    using: env:bash-node@24
    cwd: /app/app/packages/website
    env:
      HOME: /tmp
      ASTRO_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    run: node node_modules/astro/bin/astro.mjs check
    task-cache:
      inputs: [app/packages/website/**, app/packages/analytics/**]
      root-inputs: [.infrawrench/ci/node-preload.cjs, .infrawrench/ci/stubs/**]
    memory: 6GiB
    timeout: 20m

  # Both are plain Node scripts over the sources and catalogs. They read
  # `os.homedir()`, which fails without HOME, and a job's environment has
  # none.
  translations-audit:
    name: Translations audit
    using: env:bash-node@24
    cwd: /app/app/packages/web
    env: { HOME: /tmp }
    run: node scripts/translation-audit.mjs
    # What the audit reads: the sources of the four translated packages.
    # `task-cache: true` would key it on every file in the repository, and
    # rerun it for a change to anything.
    task-cache: &translation-inputs
      inputs:
        - app/packages/ui/**
        - app/packages/web/**
        - app/packages/desktop/**
        - app/packages/instances/**
    memory: 4GiB
    timeout: 20m

  translations-status:
    name: Translations status
    using: env:bash-node@24
    cwd: /app/app/packages/web
    env: { HOME: /tmp }
    run: node scripts/translation-status.mjs
    # The same packages: their sources, gt.config.json and _gt catalogs.
    task-cache: *translation-inputs
    memory: 4GiB
    timeout: 20m

  prettier:
    name: Prettier ${{ package.name }}
    packages: true
    # Prettier is a root devDependency: install just the root importer's
    # closure, not all 180 packages'.
    deps: &prettier-deps
      - pnpm:
          only: ["."]
    using: env:bash-node@24
    cwd: /app
    run: >-
      node node_modules/prettier/bin/prettier.cjs --check
      --no-error-on-unmatched-pattern "${{ package.dir }}"
    task-cache: { root-inputs: [.prettierrc, .prettierignore] }
    timeout: 10m
    memory: 1GiB

  # The rest of the repository: every top-level path outside the package
  # directories (pnpm-workspace.yaml's globs), named rather than found by
  # walking `.`, which would read every package only to ignore it.
  prettier-rest:
    name: Prettier (outside the packages)
    deps: *prettier-deps
    using: env:bash-node@24
    run: |
      shopt -s dotglob nullglob
      paths=()
      for p in * app/* plugin-architecture/*; do
        case "$p" in
          app | plugin-architecture | app/packages | plugin-architecture/packages | plugingen | node_modules | .git) ;;
          *) paths+=("$p") ;;
        esac
      done
      node node_modules/prettier/bin/prettier.cjs --check --ignore-unknown --no-error-on-unmatched-pattern "${paths[@]}"
    task-cache:
      inputs:
        - "**"
        - "!app/packages/*/**"
        - "!plugin-architecture/packages/*/**"
        - "!plugingen/**"
    timeout: 20m
    memory: 2GiB
