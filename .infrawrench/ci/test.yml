# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# test.yml (the GitHub Actions workflow) on Infrawrench CI: everything in it
# that runs on Node alone.
#
# - Prettier: `pnpm format:check`, one job per workspace package.
# - TypeScript: `pnpm typecheck`. turbo builds every library's dist/ with
#   tsdown first, and tsdown is a native binary the isolate cannot run, so
#   each library is typechecked by tsc-rs with --emitDeclarationOnly into
#   dist/ after the libraries it depends on (turbo's `dependsOn: ["^build"]`),
#   and its dist/ is handed on to everything downstream.
# - Translations: `translations:audit` and `translations:status`.
# - Vitest: `pnpm test`, one job per package, against the JavaScript of the
#   packages it depends on, which tsdown builds as turbo would (`bundle`);
#   tsc-rs writes their declarations (`build`), since tsdown's declaration
#   bundler has no WebAssembly build.
#
# Every job is task-cached: one whose files, the shared config and what it
# is handed have not changed since a passing run is not run again. What it
# is handed has to be everything it reads of the packages it depends on:
# their dist/ (`^bundle`, `^build`) and a hash of what it reads of them
# straight from the checkout (`^source`), which `prep` checks every job has.
# A test that reads a file by path outside its package and its dependencies
# names it in the package's ci-reads.json (`reads`), which `prep` checks too.
#
# Every `memory:` is sized from what the job was measured to hold (its
# report's `peak_memory_mib`), with room above it: a job starts only when
# its `memory:` fits what the runner has left, so a job that reserves 6 GiB
# and holds 1.5 keeps three others waiting. Beside each one is the largest
# peak seen across the packages it runs for. A job that outgrows its size
# fails saying it ran out of its memory, and the size goes up here.
#
# Every `using:` names an exact version. A range (`env:bash-node@24`) runs
# whatever was published last, but the task cache keys on the text, so a
# new environment would only reach the jobs whose key changed for another
# reason. To move to a new version, change every `using:` of that tool in
# this file in one commit: every job that uses it then runs once on it.
# A job naming a version that does not exist fails listing the ones that
# do (`using: env:bash-node@0.0.0`).
#
# rolldown (under Vite, Vitest and tsdown) runs as its wasm32-wasi build:
# the runner installs the WebAssembly builds of native packages and gives
# Node a working `node:wasi`. rolldown leaves that build out of its own
# optional dependencies, so the root package.json lists it.
#
# - Database migrations: `db:migrate` twice against a fresh database, the
#   second run proving it a no-op.
# - ClickHouse database tests: server-core's tests against a real ClickHouse
#   (`env:clickhouse`, ClickHouse 26.11) as a service, and the mocked
#   ClickHouse suites shadow-run against it.
# - Postgres database tests: server-core's tests against three `env:postgres`
#   servers (pglite-server, PostgreSQL 18.4) after migrating them, and the
#   mocked Postgres suites shadow-run against another.
# - Editor extensions (once .github/workflows/editor-extensions.yml): the
#   VS Code extension's .vsix and the Raycast extension's tarball, kept as
#   the run's downloads.

name: Test

on:
  push:
    branches: [main]
  pull-request: {}

# Every package's declarations are kept for the run.
scratch: 2GiB

workspace:
  deps:
    - pnpm

jobs:
  # What the packages' typecheck scripts do before tsc: desktop's
  # scripts/ensure-env.mjs copies env.example.ts to env.ts, and mobile's
  # scripts/build-terminal-html.mjs writes a generated module with esbuild (a
  # native binary); the typecheck only reads that module's type, a string.
  prep:
    name: Prepare generated files
    using: env:bash-node@24.0.18
    deps: false
    artifacts:
      - app/packages
      - plugin-architecture/packages
    # First, the check that every task-cached job below is keyed on the
    # source of the packages it depends on (`source`): it fails here, before
    # anything that could be wrongly skipped. Then the check that a test which
    # reads outside its package has declared what it reads (`reads`).
    run: |
      node .infrawrench/ci/source-digest.mjs --check
      node .infrawrench/ci/outside-reads.mjs --check
      cp app/packages/desktop/env.production.ts app/packages/desktop/env.ts
      mkdir -p app/packages/mobile/assets/generated
      echo 'export const terminalHtml: string = "";' > app/packages/mobile/assets/generated/terminal-html.ts

  # What each package's dependents read of it apart from its dist/, as one
  # hash in .source-digest (source-digest.mjs). A package with no build ships
  # its source: server-core, workflow-runtime and analytics export src/*.ts,
  # and web's and poller's tests load server-core's files through Vite. No
  # `bundle` or `build` hands those on, so without this a change to
  # server-core reran its own tests and replayed web's (#1175). For a library
  # the hash is the fields of package.json that decide what an import of it
  # resolves to, and any entry point outside dist/ with what that can reach
  # (plugin-base's `./test-harness` is src/, so all of it but the tests).
  #
  # `^source` on a job hands it the hash of every package its own depends on,
  # as `^bundle` hands it their dist/, and so puts them in its task cache
  # key: a server-core change reruns the tests and typechecks of server-core's
  # dependents and nothing else. Each waits for its dependencies' only to hand
  # theirs down the chain, so they are left out of its own key. The hash
  # leaves out test files, which nothing outside their package loads: a
  # changed test reruns this job, which writes the same hash, and its
  # dependents stay cached.
  source:
    name: Source ${{ package.name }}
    packages: true
    needs: ["^source"]
    using: env:bash-node@24.0.18
    deps: false
    run: node /app/.infrawrench/ci/source-digest.mjs
    artifacts: [.source-digest]
    task-cache: { root-inputs: [.infrawrench/ci/source-digest.mjs], artifacts: false }
    memory: 1GiB
    timeout: 5m

  # The files a package's tests read by path outside the package, as one hash
  # in .reads-digest (outside-reads.mjs). server-core's tests compare a file
  # with bastion-agent's copy of it, ui's scan web's and desktop's components,
  # web's read a page of the website's docs: none of those packages is a
  # dependency of the reader, so `^source` does not reach them, and the tests
  # were replayed from the cache when the file changed (#1177). A package
  # lists such files in a ci-reads.json beside its package.json, and its test
  # jobs need this job, so they are keyed on the hash: a change to
  # bastion-agent's copy reruns server-core's tests and nothing else.
  #
  # Only the packages with a ci-reads.json get one. It is not task-cached: its
  # key would hold its own package's files, not the ones it hashes. `prep`
  # scans every package for a test that leaves it without declaring what it
  # reads (outside-reads.mjs has what the scan can and cannot see).
  reads:
    name: Outside reads ${{ package.name }}
    packages: { has: [ci-reads.json] }
    using: env:bash-node@24.0.18
    deps: false
    run: node /app/.infrawrench/ci/outside-reads.mjs
    artifacts: [.reads-digest]
    memory: 1GiB
    timeout: 5m

  # Each library's JavaScript, as `pnpm build` writes it, for the tests of
  # the packages that use it. Declarations are `build`'s.
  # Each waits for the libraries it depends on, though tsdown does not read
  # them: that is what hands every library's dist/ down the whole chain, so
  # a test two levels up still has plugin-base's. tsdown leaves workspace
  # dependencies external (every library lists them as dependencies or peer
  # dependencies), so what it is handed is left out of its task cache key:
  # a change to plugin-base rebuilds plugin-base, not the bundles above it.
  # The tests are still keyed on every dist/ they are handed.
  bundle:
    name: Bundle ${{ package.name }}
    packages: { scripts: { build: "tsdown*" } }
    needs: ["^bundle"]
    using: env:bash-node@24.0.18
    run: node node_modules/tsdown/dist/run.mjs --no-dts
    artifacts: [dist]
    task-cache: { root-inputs: [tsconfig.base.json], artifacts: false }
    # Peak 860 MiB (ui).
    memory: 2GiB
    timeout: 20m

  # Each package's `test` script, with the JavaScript of everything it
  # depends on. The runner's installer writes no node_modules/.bin, so
  # `vitest` in the script runs as its entry point.
  #
  # Every package's: plugingen's run real git, which every environment has
  # (ci-runner/README.md, "Git"). A package taken off this job goes back on
  # GitHub Actions, in a Vitest job of test.yml's that runs exactly the
  # packages left out here.
  #
  # Native code with no WebAssembly build in the same package, and what the
  # runner's Node does not do yet:
  # - node-preload.cjs, beside this file, hands a package that lists
  #   `@rollup/wasm-node` or `esbuild-wasm` that build in place of Rollup's
  #   or esbuild's, which Vite 6 (web's and desktop's Vitest) loads before
  #   it reads the package's config; and answers for node-pty, which tests
  #   import without opening a terminal (stubs/). bastion-agent's bundle
  #   test picks `esbuild-wasm` itself.
  # - libsql's addon: turso's test mocks the client it never makes, and
  #   server-core, poller, web and desktop swap it for the client's
  #   addon-free entry in their vitest.config.ts.
  # - Electron, whose install script never runs here: desktop's
  #   vitest.config.ts gives `require("electron")` a path to answer with.
  #
  # A `node` reserves its JavaScript heap out of what is left of the job's
  # `memory:`, so a Vitest job's peak follows its size rather than saying
  # what it needs: the small suites peak at 3.5 to 4 GiB given 6 GiB and at
  # 1.8 to 2.8 GiB given 3 GiB. Every suite passes at 3 GiB; at 2 GiB
  # server-core, workflow-runtime and the ClickHouse plugin run out.
  #
  # Vitest starts a `node` per test file, and most of a large suite's time is
  # each of them loading its modules, so how many run at once is what sets a
  # large suite's time. The script takes it from the runner's cores (`nproc`):
  # web gets half the cores, server-core, desktop and ui a quarter each, and
  # every other suite two workers, which a few test files cannot use more
  # than. Past the limits below a suite gains little and each worker is
  # another heap: about 450 MiB in web and server-core, 300 MiB in desktop
  # and ui.
  #
  # What each file loads matters as much. web's and server-core's configs
  # have Vitest bundle the packages nearly every file imports (`effect`,
  # `drizzle-orm`, client-core, the API contract, plugin-base) once per run
  # rather than read them module by module in every file's `node`
  # (server-core/vitest.prebundle.ts). Alone on eight cores that took web
  # from 252 s, 144 s and 122 s at two, four and six workers to 146 s, 92 s
  # and 72 to 92 s, and server-core from 85 s at four to 49 s. desktop (108 s
  # and 66 s at two and four) and ui (127 s and 70 s) load theirs as they
  # did.
  #
  # `memory:` holds the most workers a suite can get. desktop and ui at four
  # peak at 3.2 and 3.6 GiB and pass at 3 GiB. web at six and server-core at
  # four pass at 5 GiB, so they are a job of their own (`test-large`) one
  # step above that, with the same script.
  test:
    name: Test ${{ package.name }}
    packages:
      scripts: { test: "*vitest run*" }
      only: ["**", "!app/packages/web", "!app/packages/server-core"]
    needs: &test-needs [prep, bundle, reads, "^bundle", "^source"]
    using: env:bash-node@24.0.18
    env: &test-env
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    run: &test-run |
      cores="$(nproc)"
      case "${{ package.dir }}" in
        app/packages/web) workers=$((cores / 2)) most=6 ;;
        app/packages/server-core | app/packages/desktop | app/packages/ui) workers=$((cores / 4)) most=4 ;;
        *) workers=2 most=2 ;;
      esac
      if ((workers < 2)); then workers=2; fi
      if ((workers > most)); then workers=$most; fi
      script="$(node -p 'require("./package.json").scripts.test')"
      eval "${script//vitest run/node node_modules/vitest/vitest.mjs run --maxWorkers=$workers}"
    task-cache: &test-cache
      root-inputs: [tsconfig.base.json, .infrawrench/ci/node-preload.cjs, .infrawrench/ci/stubs/**]
    memory: 4GiB
    timeout: 30m

  # web and server-core, which need more memory than the rest at the workers
  # they get (above). Peak 5.2 GiB (web at six workers), 4.5 GiB (server-core
  # at four).
  test-large:
    name: Test ${{ package.name }}
    packages:
      scripts: { test: "*vitest run*" }
      only: [app/packages/web, app/packages/server-core]
    needs: *test-needs
    using: env:bash-node@24.0.18
    env: *test-env
    run: *test-run
    task-cache: *test-cache
    memory: 6GiB
    timeout: 30m

  # Each library, after the libraries it depends on.
  build:
    name: Library ${{ package.name }}
    packages: { scripts: { build: "tsdown*" } }
    needs: [prep, "^build", "^source"]
    using: builtin:typescript@7.1.0
    args:
      [
        --noEmit,
        "false",
        --emitDeclarationOnly,
        --declaration,
        --declarationMap,
        "false",
        --rootDir,
        src,
        --outDir,
        dist,
      ]
    artifacts: [dist]
    task-cache: { root-inputs: [tsconfig.base.json] }
    # Peak 910 MiB (ui); 190 MiB for a plugin.
    memory: 2GiB
    timeout: 20m

  # Every other package whose typecheck is plain `tsc --noEmit`, against the
  # declarations of what it depends on.
  check:
    name: Typecheck ${{ package.name }}
    packages:
      scripts: { build: "!tsdown*", typecheck: "tsc --noEmit*" }
    needs: [prep, "^build", "^source"]
    using: builtin:typescript@7.1.0
    args: [--noEmit, -p, .]
    task-cache: { root-inputs: [tsconfig.base.json] }
    # Peak 2.9 GiB (web), 1.4 GiB (server-core), under 1 GiB for the rest.
    memory: 4GiB
    timeout: 30m

  # The Worker entry points (`tsc --noEmit -p edge`).
  edge:
    name: Typecheck ${{ package.name }} (edge)
    packages:
      has: [edge]
      scripts: { typecheck: "*tsc --noEmit -p edge*" }
    needs: [prep, "^build", "^source"]
    using: builtin:typescript@7.1.0
    args: [--noEmit, -p, edge]
    task-cache: { root-inputs: [tsconfig.base.json] }
    # Peak 2.3 GiB (web).
    memory: 4GiB
    timeout: 30m

  # Desktop's typecheck runs ensure-env first (prep does that), then two
  # projects. A `packages:` job of one package, so that `^build` and
  # `^source` follow what desktop depends on (workflow-runtime ships source).
  desktop:
    name: Typecheck desktop (${{ matrix }})
    packages: { only: [app/packages/desktop] }
    matrix: [tsconfig.node.json, tsconfig.web.json]
    needs: [prep, "^build", "^source"]
    using: builtin:typescript@7.1.0
    args: [--noEmit, -p, "${{ matrix }}"]
    task-cache: { root-inputs: [tsconfig.base.json] }
    # Peak 1.4 GiB.
    memory: 3GiB
    timeout: 30m

  # The packages that pin TypeScript 6 (mobile, plugingen, website) run
  # their own compiler, which is JavaScript, under Node.
  mobile:
    name: Typecheck mobile (TypeScript 6)
    packages: { only: [app/packages/mobile] }
    needs: [prep, "^build", "^source"]
    using: env:bash-node@24.0.18
    # The runner's installer writes no node_modules/.bin, so the package's
    # own entry point, as `tsc6` would run it.
    run: node node_modules/typescript/bin/tsc6 --noEmit
    task-cache: { root-inputs: [tsconfig.base.json] }
    # Peak 600 MiB.
    memory: 2GiB
    timeout: 30m

  plugingen:
    name: Typecheck plugingen (TypeScript 6)
    using: env:bash-node@24.0.18
    cwd: /app/plugingen
    run: node node_modules/typescript/bin/tsc6 --noEmit
    task-cache: { inputs: [plugingen/**] }
    # Peak 580 MiB.
    memory: 2GiB
    timeout: 20m

  # `astro check`: `astro sync` writes the content collections' types into
  # .astro/, then @astrojs/check runs the website's TypeScript over the
  # .astro and .ts files. The only workspace package it reads is
  # analytics, which ships its source. Loading astro.config.mjs loads the
  # Cloudflare adapter and so workerd, which has no WebAssembly build and is
  # never started here, and Tailwind's Lightning CSS, whose WebAssembly
  # build the website lists: node-preload.cjs answers for both. Astro keeps its
  # telemetry settings under HOME, which a job's environment does not set.
  website:
    name: Typecheck website (astro check)
    using: env:bash-node@24.0.18
    cwd: /app/app/packages/website
    env:
      HOME: /tmp
      ASTRO_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    run: node node_modules/astro/bin/astro.mjs check
    task-cache:
      inputs: [app/packages/website/**, app/packages/analytics/**]
      root-inputs: [.infrawrench/ci/node-preload.cjs, .infrawrench/ci/stubs/**]
    # Peak 3.7 GiB.
    memory: 5GiB
    timeout: 20m

  # Both are plain Node scripts over the sources and catalogs. They read
  # `os.homedir()`, which fails without HOME, and a job's environment has
  # none.
  translations-audit:
    name: Translations audit
    using: env:bash-node@24.0.18
    cwd: /app/app/packages/web
    env: { HOME: /tmp }
    run: node scripts/translation-audit.mjs
    # What the audit reads: the sources of the four translated packages.
    # `task-cache: true` would key it on every file in the repository, and
    # rerun it for a change to anything.
    task-cache: &translation-inputs
      inputs:
        - app/packages/ui/**
        - app/packages/web/**
        - app/packages/desktop/**
        - app/packages/instances/**
    # Peak 560 MiB.
    memory: 2GiB
    timeout: 20m

  translations-status:
    name: Translations status
    using: env:bash-node@24.0.18
    cwd: /app/app/packages/web
    env: { HOME: /tmp }
    run: node scripts/translation-status.mjs
    # The same packages: their sources, gt.config.json and _gt catalogs.
    task-cache: *translation-inputs
    # Peak 600 MiB.
    memory: 2GiB
    timeout: 20m

  prettier:
    name: Prettier ${{ package.name }}
    packages: true
    # Prettier is a root devDependency: install just the root importer's
    # closure, not all 180 packages'.
    deps: &prettier-deps
      - pnpm:
          only: ["."]
    using: env:bash-node@24.0.18
    cwd: /app
    run: >-
      node node_modules/prettier/bin/prettier.cjs --check
      --no-error-on-unmatched-pattern "${{ package.dir }}"
    task-cache: { root-inputs: [.prettierrc, .prettierignore] }
    timeout: 10m
    memory: 1GiB

  # The rest of the repository: every top-level path outside the package
  # directories (pnpm-workspace.yaml's globs), named rather than found by
  # walking `.`, which would read every package only to ignore it.
  prettier-rest:
    name: Prettier (outside the packages)
    deps: *prettier-deps
    using: env:bash-node@24.0.18
    run: |
      shopt -s dotglob nullglob
      paths=()
      for p in * app/* plugin-architecture/*; do
        case "$p" in
          app | plugin-architecture | app/packages | plugin-architecture/packages | plugingen | node_modules | .git) ;;
          *) paths+=("$p") ;;
        esac
      done
      node node_modules/prettier/bin/prettier.cjs --check --ignore-unknown --no-error-on-unmatched-pattern "${paths[@]}"
    # Everything outside the packages but what Prettier has no parser for,
    # which is most of what changes there: the runner's and the app server's
    # Rust, the provider's Go, Terraform, shell scripts and the patches. With
    # those in the key the job ran on nearly every commit to check the same
    # seventy files. Only exclusions, so a kind of file not named here is
    # still in the key: the list can cost a run it did not need, never skip
    # one it did. .prettierrc and .prettierignore are among what is left. The
    # provider's docs/ is the one directory left out for being in
    # .prettierignore: tfplugindocs rewrites it with every schema change.
    task-cache:
      inputs:
        - "**"
        - "!app/packages/*/**"
        - "!plugin-architecture/packages/*/**"
        - "!plugingen/**"
        - "!terraform-provider-infrawrench/docs/**"
        - "!**/*.rs"
        - "!**/*.go"
        - "!**/*.toml"
        - "!**/*.sh"
        - "!**/*.tf"
        - "!**/*.patch"
        - "!**/*.sql"
        - "!**/*.php"
        - "!**/*.h"
        - "!**/*.cc"
        - "!**/*.cmake"
        - "!**/*.txt"
        - "!**/Cargo.lock"
        - "!**/go.mod"
        - "!**/go.sum"
        - "!**/VERSION"
    timeout: 20m
    memory: 2GiB

  # `db:migrate` (drizzle-kit migrate) against an empty database, then again:
  # the second run must find nothing to apply. pglite-server stands in for
  # Postgres; of pgcrypto the migrations call only digest(), which it has.
  # drizzle-kit loads drizzle.config.ts through the tsx it bundles, which
  # needs esbuild: node-preload.cjs hands it web's esbuild-wasm, as it does
  # Vite. Any user and database are accepted, so DATABASE_URL is the one
  # docker-compose.dev.yml uses.
  migrations:
    name: Database migrations
    deps:
      - pnpm:
          only: [app/packages/web]
    using: env:bash-node@24.0.18
    cwd: /app/app/packages/web
    services:
      postgres:
        using: env:postgres@18.4.2
        run: pglite-server
        ready: { port: 5432 }
    env:
      DATABASE_URL: postgres://infrawrench:infrawrench@postgres:5432/infrawrench
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    run: |
      node node_modules/drizzle-kit/bin.cjs migrate
      node node_modules/drizzle-kit/bin.cjs migrate
    task-cache:
      inputs:
        - app/packages/web/drizzle.config.ts
        - app/packages/web/package.json
        - app/packages/web/src/db/migrations/**
        - .infrawrench/ci/node-preload.cjs
    memory: 3GiB
    timeout: 20m

  # `test:db`'s ClickHouse files (DDL from migrateMetrics, inserts, the
  # materialized-view rollups, the cost and network-flow SQL) and
  # `test:clickhouse:shadow` (every statement the mocked suites capture, also
  # run against the server). ClickHouse 26.11 is newer than production's
  # 26.3, so this is also where a release's changed defaults show up first
  # (#1114, #1116).
  clickhouse-db:
    name: ClickHouse tests ${{ package.name }}
    packages: { only: [app/packages/server-core] }
    needs: [prep, "^bundle", "^source"]
    using: env:bash-node@24.0.18
    services:
      clickhouse:
        using: env:clickhouse@26.11.3
        run: clickhouse-server
        env:
          CLICKHOUSE_DB: infrawrench
          CLICKHOUSE_PASSWORD: infrawrench
        ready: { port: 8123, timeout: 120s }
    env:
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
      CLICKHOUSE_METRICS_URL: http://clickhouse:8123
      CLICKHOUSE_METRICS_USER: default
      CLICKHOUSE_METRICS_PASSWORD: infrawrench
      CLICKHOUSE_METRICS_DATABASE: infrawrench
    run: |
      node node_modules/vitest/vitest.mjs run --config vitest.db.config.ts src/__tests__/db/clickhouse.test.ts src/__tests__/db/clickhouse-cost.test.ts
      node node_modules/vitest/vitest.mjs run --config vitest.shadow-clickhouse.config.ts
    task-cache:
      root-inputs: [tsconfig.base.json, .infrawrench/ci/node-preload.cjs, .infrawrench/ci/stubs/**]
    memory: 4GiB
    timeout: 20m

  # The Postgres integration suites against `env:postgres` (pglite-server,
  # PostgreSQL 18.4; production runs 18.6), migrated first. It runs the whole
  # `vitest.db.config.ts`, so a new file in src/__tests__/db/ is picked up;
  # the ClickHouse files there skip themselves without CLICKHOUSE_METRICS_*,
  # and `clickhouse-db` runs them. pglite-server has one backend: transactions
  # run one at a time, row locks never contend, and pgcrypto is partial
  # (README, "PostgreSQL"). A test of real lock contention needs a real server.
  #
  # Three servers, each migrated, and a Vitest worker for each (DATABASE_URLS,
  # vitest.db.config.ts). A file still has a whole database to itself for as
  # long as it runs: these suites write rows, and the CI passes they test read
  # every organization's, so two files on one server would read each other's.
  # More connections to one server would not help anyway, since its one
  # backend runs their statements in turn.
  #
  # Unlike the shadow run, this job's time is SQL. Alone on ci-1 it took 77 to
  # 82 s one file at a time: migrating 3 s, the files 76 s, of which 52 s were
  # the three 70,000-row syncs of one file (sync-scale), which no number of
  # workers shortens. That file is three now, and they go first, one to a
  # server. With two servers the job takes 41 to 46 s, with three 32 to 37 s,
  # with four 33 to 34 s. Each server keeps its tables and write-ahead log in
  # memory (0.2 to 0.3 GiB after a sync, beside its 128 MiB of buffers) and
  # each worker is another heap, so the job peaks at 2.8 to 3.1 GiB on one
  # server, 3.4 to 3.8 on two, 4.0 to 4.3 on three and 4.9 on four.
  #
  # The mocked Postgres suites shadow-run in a job of their own
  # (`postgres-shadow`) against a server of their own: one after the other in
  # one job they were the longest job of a run once web's tests were not
  # (190 s; 80 s and 115 s apart).
  postgres-db:
    name: Postgres tests ${{ package.name }}
    packages: { only: [app/packages/server-core] }
    needs: [prep, "^bundle", "^source"]
    using: env:bash-node@24.0.18
    services:
      postgres: &postgres-server
        using: env:postgres@18.4.2
        run: pglite-server
        ready: { port: 5432 }
      postgres-2:
        using: env:postgres@18.4.2
        run: pglite-server -port 5433 -backend-port 54330
        ready: { port: 5433 }
      postgres-3:
        using: env:postgres@18.4.2
        run: pglite-server -port 5434 -backend-port 54331
        ready: { port: 5434 }
    env:
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
      DATABASE_URLS: >-
        postgres://infrawrench:infrawrench@postgres:5432/infrawrench,
        postgres://infrawrench:infrawrench@postgres-2:5433/infrawrench,
        postgres://infrawrench:infrawrench@postgres-3:5434/infrawrench
    run: |
      IFS=', ' read -ra servers <<< "$DATABASE_URLS"
      migrations=()
      for server in "${servers[@]}"; do
        (cd ../web && DATABASE_URL=$server node node_modules/drizzle-kit/bin.cjs migrate) &
        migrations+=($!)
      done
      for migration in "${migrations[@]}"; do wait "$migration"; done
      node node_modules/vitest/vitest.mjs run --config vitest.db.config.ts
    task-cache: &postgres-cache
      root-inputs:
        - tsconfig.base.json
        - .infrawrench/ci/node-preload.cjs
        - .infrawrench/ci/stubs/**
        - app/packages/web/drizzle.config.ts
        - app/packages/web/src/db/migrations/**
    # Peak 4.3 GiB.
    memory: 5GiB
    timeout: 30m

  # `test:postgres:shadow`: every statement the mocked suites capture,
  # PREPAREd against the migrated schema and never executed.
  #
  # Its files run in parallel, on a quarter of the runner's cores (four
  # workers at most, as server-core's tests). Nearly all of its time is each
  # file's `node` loading its modules, not the statements: alone on ci-1, 99 s
  # one file at a time (94 s with the PREPAREs turned off), 54 s at two
  # workers, 35 s at four, 32 s at six, all within this `memory:`. Migrating
  # takes 2 s. The server is still one session, which every worker's
  # connection shares, so helpers/fake-postgres.ts names each file's
  # statements apart.
  postgres-shadow:
    name: Postgres shadow tests ${{ package.name }}
    packages: { only: [app/packages/server-core] }
    needs: [prep, "^bundle", "^source"]
    using: env:bash-node@24.0.18
    services: { postgres: *postgres-server }
    env:
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
      DATABASE_URL: postgres://infrawrench:infrawrench@postgres:5432/infrawrench
    run: |
      (cd ../web && node node_modules/drizzle-kit/bin.cjs migrate)
      workers=$(($(nproc) / 4))
      if ((workers < 2)); then workers=2; fi
      if ((workers > 4)); then workers=4; fi
      node node_modules/vitest/vitest.mjs run --config vitest.shadow-postgres.config.ts --maxWorkers=$workers
    task-cache: *postgres-cache
    memory: 4GiB
    timeout: 30m

  # The editor extensions, packaged for people to install by hand or submit
  # (KNOWLEDGE.md, "Editor extensions"): the VS Code extension's .vsix and
  # the Raycast extension's `ray build` output. Their typecheck and tests are
  # `check` and `test`. A job that keeps downloads cannot be task-cached, so
  # `paths:` skips them when nothing they package changed: the extension
  # itself, the two libraries it bundles (client-core, and plugin-base under
  # it), what decides the versions and settings of what it is built with, and
  # this pipeline. The app sends a push the commit the branch moved from, as
  # it sends a pull request its base; a new branch or a force push has
  # neither, and runs both. Each bundles
  # client-core's JavaScript, which `^bundle` hands them, with esbuild, whose
  # native binary cannot run here: each package lists the matching
  # esbuild-wasm, which node-preload.cjs hands them in its place.
  vscode:
    name: Package the VS Code extension
    packages: { only: [app/packages/vscode] }
    paths:
      - app/packages/vscode/**
      - app/packages/client-core/**
      - plugin-architecture/packages/plugin-base/**
      - "!**/__tests__/**"
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .infrawrench/ci/test.yml
      - .infrawrench/ci/node-preload.cjs
      - .infrawrench/ci/stubs/**
    deps:
      - pnpm:
          only: [app/packages/vscode]
    needs: ["^bundle"]
    using: env:bash-node@24.0.18
    env:
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    # The package script (esbuild, then `vsce package` on a staged copy in
    # out/stage), and the .vsix moved into a directory of its own so the
    # download is the package alone.
    run: |
      eval "$(node -p 'require("./package.json").scripts.package')"
      mkdir vsix
      mv out/*.vsix vsix/
    downloads: [vsix]
    # Peak 1 GiB.
    memory: 2GiB
    timeout: 20m

  # `ray build -e dist` ends by running ./node_modules/.bin/tsc --noEmit,
  # which the runner's installer does not write and tsc-rs could not run
  # here: `--skip-types` (one of ray's own flags) leaves that check to
  # `check`, which runs the same `tsc --noEmit` on the package. The
  # environment has no tar, so the package's own node-tar writes the tarball.
  raycast:
    name: Package the Raycast extension
    packages: { only: [app/packages/raycast] }
    paths:
      - app/packages/raycast/**
      - app/packages/client-core/**
      - plugin-architecture/packages/plugin-base/**
      - "!**/__tests__/**"
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .infrawrench/ci/test.yml
      - .infrawrench/ci/node-preload.cjs
      - .infrawrench/ci/stubs/**
    deps:
      - pnpm:
          only: [app/packages/raycast]
    needs: ["^bundle"]
    using: env:bash-node@24.0.18
    env:
      NODE_OPTIONS: --require /app/.infrawrench/ci/node-preload.cjs
    run: |
      script="$(node -p 'require("./package.json").scripts.build')"
      eval "${script//ray /node node_modules/@raycast/api/bin/run.js } --skip-types"
      node -e 'require("tar").c({ gzip: true, sync: true, file: "infrawrench-raycast.tgz", cwd: "dist" }, ["."])'
    downloads: [infrawrench-raycast.tgz]
    # Peak 1 GiB.
    memory: 2GiB
    timeout: 20m
