# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# `pnpm typecheck` (test.yml's TypeScript job) on Infrawrench CI.
#
# turbo builds every library's dist/ with tsdown before typechecking, and
# tsdown is a native binary the isolate cannot run. So each library is
# typechecked by tsc-rs (the same v0.8.0 the catalog pins) with
# --emitDeclarationOnly into dist/, level by level, and its dist/ is handed
# to the next level as artifacts. Then every app project is checked against
# all of them. typescript-plan.mjs works out the levels and the projects;
# the l<level><chunk> jobs are fixed, and an empty one is skipped.
#
# This file is generated by hand from the shape in typescript-plan.mjs:
# 5 levels of 3 jobs of up to 64 packages. The plan fails if the workspace
# outgrows it.
name: TypeScript

on:
  push:
    branches: [main]
  pull-request: {}

# Every package's declarations are kept for the run.
scratch: 2GiB

workspace:
  deps:
    - pnpm

jobs:
  plan:
    name: Plan
    using: env:bash-node@24
    deps: false
    outputs: [l0a, l0b, l0c, l1a, l1b, l1c, l2a, l2b, l2c, l3a, l3b, l3c, l4a, l4b, l4c, checks]
    # The declaration shims it writes for renamed tsdown entries.
    artifacts: [app/packages, plugin-architecture/packages]
    run: node .infrawrench/ci/typescript-plan.mjs

  # What the packages' typecheck scripts do before tsc: desktop's
  # scripts/ensure-env.mjs copies env.example.ts to env.ts, and mobile's
  # scripts/build-terminal-html.mjs writes a generated module with esbuild (a
  # native binary). The typecheck only reads that module's type, a string.
  prep:
    name: Prepare generated files
    using: env:bash@5.1
    deps: false
    artifacts: [app/packages/desktop/env.ts, app/packages/mobile/assets/generated]
    run: |
      cp app/packages/desktop/env.example.ts app/packages/desktop/env.ts
      mkdir -p app/packages/mobile/assets/generated
      echo 'export const terminalHtml: string = "";' > app/packages/mobile/assets/generated/terminal-html.ts

  l0a:
    name: Library ${{ matrix }}
    needs: [plan]
    matrix: ${{ needs.plan.outputs.l0a }}
    using: builtin:typescript@7.1
    cwd: "/app/${{ matrix }}"
    args:
      [
        --noEmit,
        "false",
        --emitDeclarationOnly,
        --declaration,
        --declarationMap,
        "false",
        --rootDir,
        src,
        --outDir,
        dist,
      ]
    artifacts: ["${{ matrix }}/dist"]
    memory: 3GiB
    timeout: 20m

  l0b:
    name: Library ${{ matrix }}
    needs: [plan]
    matrix: ${{ needs.plan.outputs.l0b }}
    using: builtin:typescript@7.1
    cwd: "/app/${{ matrix }}"
    args:
      [
        --noEmit,
        "false",
        --emitDeclarationOnly,
        --declaration,
        --declarationMap,
        "false",
        --rootDir,
        src,
        --outDir,
        dist,
      ]
    artifacts: ["${{ matrix }}/dist"]
    memory: 3GiB
    timeout: 20m

  l0c:
    name: Library ${{ matrix }}
    needs: [plan]
    matrix: ${{ needs.plan.outputs.l0c }}
    using: builtin:typescript@7.1
    cwd: "/app/${{ matrix }}"
    args:
