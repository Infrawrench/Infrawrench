    artifacts: ["${{ matrix }}/dist"]
    memory: 3GiB
    timeout: 20m

  l3a:
    name: Library ${{ matrix }}
    needs: [plan, l2a, l2b, l2c]
    matrix: ${{ needs.plan.outputs.l3a }}
    using: builtin:typescript@7.1
    cwd: "/app/${{ matrix }}"
    args:
      [
        --noEmit,
