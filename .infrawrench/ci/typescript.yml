    artifacts: ["${{ matrix }}/dist"]
    memory: 3GiB
    timeout: 20m

  l1c:
    name: Library ${{ matrix }}
    needs: [plan, l0a, l0b, l0c]
    matrix: ${{ needs.plan.outputs.l1c }}
    using: builtin:typescript@7.1
