        --outDir,
        dist,
      ]
    artifacts: ["${{ matrix }}/dist"]
    memory: 3GiB
    timeout: 20m

  check:
    name: App ${{ matrix }}
    needs: [plan, prep, l4a, l4b, l4c]
    matrix: ${{ needs.plan.outputs.checks }}
    using: builtin:typescript@7.1
    args: [--noEmit, -p, "/app/${{ matrix }}"]
    memory: 6GiB
    timeout: 30m

  # The packages that pin TypeScript 6 (website, mobile, plugingen) run their
  # own compiler, which is JavaScript, under Node.
  mobile:
    name: Mobile (TypeScript 6)
    needs: [prep, l4a, l4b, l4c]
    using: env:bash-node@24
    cwd: /app/app/packages/mobile
    # The runner's installer writes no node_modules/.bin, so the package's
    # own entry point, as `tsc6` would run it.
    run: node node_modules/typescript/bin/tsc6 --noEmit
    memory: 6GiB
    timeout: 30m

  plugingen:
    name: plugingen (TypeScript 6)
    using: env:bash-node@24
    cwd: /app/plugingen
    run: node node_modules/typescript/bin/tsc6 --noEmit
    memory: 4GiB
    timeout: 20m

  website:
    name: Website (astro check)
    needs: [l4a, l4b, l4c]
    using: env:bash-node@24
    cwd: /app/app/packages/website
    run: node node_modules/astro/bin/astro.mjs check
    memory: 6GiB
    timeout: 30m
