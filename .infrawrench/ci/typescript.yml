# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# `pnpm typecheck` (test.yml's TypeScript job) on Infrawrench CI.
#
# turbo builds every library's dist/ with tsdown before typechecking, and
# tsdown is a native binary the isolate cannot run. So each library is
# typechecked by tsc-rs (the same v0.8.0 the catalog pins) with
# --emitDeclarationOnly into dist/, after the libraries it depends on, as
# turbo's `dependsOn: ["^build"]` would order it; its dist/ is handed on to
# everything downstream. Then each app is checked against them.
#
# Every job here is task-cached: one whose package, the shared tsconfig and
# the declarations it is handed have not changed since a passing run does
# not run again, so a change to one package rechecks that package and what
# depends on it.
name: TypeScript

on:
  push:
    branches: [main]
  pull-request: {}

# Every package's declarations are kept for the run.
scratch: 2GiB

workspace:
  deps:
    - pnpm

jobs:
  # What the packages' typecheck scripts do before tsc: desktop's
  # scripts/ensure-env.mjs copies env.example.ts to env.ts, and mobile's
  # scripts/build-terminal-html.mjs writes a generated module with esbuild (a
  # native binary); the typecheck only reads that module's type, a string.
  # Plus the shims for the tsdown entries tsc names differently.
  prep:
    name: Prepare generated files
    using: env:bash-node@24
    deps: false
    artifacts:
      - app/packages
      - plugin-architecture/packages
    run: |
      cp app/packages/desktop/env.example.ts app/packages/desktop/env.ts
      mkdir -p app/packages/mobile/assets/generated
      echo 'export const terminalHtml: string = "";' > app/packages/mobile/assets/generated/terminal-html.ts
      node .infrawrench/ci/typescript-shims.mjs

  # Each library, after the libraries it depends on.
  build:
    name: Library ${{ package.name }}
    packages: { scripts: { build: "tsdown*" } }
    needs: [prep, "^build"]
    using: builtin:typescript@7.1
    args:
      [
        --noEmit,
        "false",
        --emitDeclarationOnly,
        --declaration,
        --declarationMap,
        "false",
        --rootDir,
        src,
        --outDir,
        dist,
      ]
    artifacts: [dist]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 3GiB
    timeout: 20m

  # Every other package whose typecheck is plain `tsc --noEmit`, against the
  # declarations of what it depends on.
  check:
    name: ${{ package.name }}
    packages:
      scripts: { build: "!tsdown*", typecheck: "tsc --noEmit*" }
    needs: [prep, "^build"]
    using: builtin:typescript@7.1
    args: [--noEmit, -p, .]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 6GiB
    timeout: 30m

  # The Worker entry points (`tsc --noEmit -p edge`).
  edge:
    name: ${{ package.name }} (edge)
    packages:
      has: [edge]
      scripts: { typecheck: "*tsc --noEmit -p edge*" }
    needs: [prep, "^build"]
    using: builtin:typescript@7.1
    args: [--noEmit, -p, edge]
    task-cache: { root-inputs: [tsconfig.base.json] }
    memory: 6GiB
    timeout: 30m

  # Desktop's typecheck runs ensure-env first (prep does that), then two
  # projects.
  desktop:
    name: desktop (${{ matrix }})
    matrix: [tsconfig.node.json, tsconfig.web.json]
    needs: [prep, build]
    using: builtin:typescript@7.1
    cwd: /app/app/packages/desktop
    args: [--noEmit, -p, "${{ matrix }}"]
    task-cache:
      inputs: [app/packages/desktop/**]
      root-inputs: [tsconfig.base.json]
    memory: 6GiB
    timeout: 30m

  # The packages that pin TypeScript 6 (mobile, plugingen) run their own
  # compiler, which is JavaScript, under Node. The website's `astro check`
  # stays on GitHub Actions until the runner's Node can start worker threads,
  # which rolldown needs.
  mobile:
    name: Mobile (TypeScript 6)
    needs: [prep, build]
    using: env:bash-node@24
    cwd: /app/app/packages/mobile
    # The runner's installer writes no node_modules/.bin, so the package's
    # own entry point, as `tsc6` would run it.
    run: node node_modules/typescript/bin/tsc6 --noEmit
    task-cache:
      inputs: [app/packages/mobile/**]
      root-inputs: [tsconfig.base.json]
    memory: 6GiB
    timeout: 30m

  plugingen:
    name: plugingen (TypeScript 6)
    using: env:bash-node@24
    cwd: /app/plugingen
    run: node node_modules/typescript/bin/tsc6 --noEmit
    task-cache: { inputs: [plugingen/**] }
    memory: 4GiB
    timeout: 20m
