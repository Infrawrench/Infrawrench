# yaml-language-server: $schema=../../ci-runner/schema/ci.schema.json
#
# `pnpm format:check` (test.yml's Prettier job) on Infrawrench CI: the
# repository's own Prettier, from its lockfile, on Node under bash-node.
#
# One job per workspace package plus one for everything outside them, each
# task-cached: a change checks the packages it touches, and the rest are
# replayed. Every job runs from the root, so the root's .prettierrc and
# .prettierignore apply as they do to `prettier --check .`.
name: Prettier

on:
  push:
    branches: [main]
  pull-request: {}

workspace:
  deps:
    # Prettier is a root devDependency: install just the root importer's
    # closure, not all 180 packages'.
    - pnpm:
        only: ["."]

jobs:
  package:
    name: ${{ package.name }}
    packages: true
    using: env:bash-node@24
    cwd: /app
    run: >-
      node node_modules/prettier/bin/prettier.cjs --check
      --no-error-on-unmatched-pattern "${{ package.dir }}"
    task-cache: { root-inputs: [.prettierrc, .prettierignore] }
    timeout: 10m
    memory: 1GiB

  # The rest of the repository: every top-level path outside the package
  # directories (pnpm-workspace.yaml's globs), named rather than found by
  # walking `.`, which would read every package only to ignore it.
  rest:
    name: Outside the packages
    using: env:bash-node@24
    run: |
      shopt -s dotglob nullglob
      paths=()
      for p in * app/* plugin-architecture/*; do
        case "$p" in
          app | plugin-architecture | app/packages | plugin-architecture/packages | plugingen | node_modules | .git) ;;
          *) paths+=("$p") ;;
        esac
      done
      node node_modules/prettier/bin/prettier.cjs --check --ignore-unknown --no-error-on-unmatched-pattern "${paths[@]}"
    task-cache:
      inputs:
        - "**"
        - "!app/packages/*/**"
        - "!plugin-architecture/packages/*/**"
        - "!plugingen/**"
    timeout: 20m
    memory: 2GiB
