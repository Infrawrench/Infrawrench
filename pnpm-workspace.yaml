packages:
  - "plugin-architecture/packages/*"
  - "app/packages/*"

# TypeScript 7 packages depend on this (`"typescript": "catalog:"`). It is
# tsc-rs installed under the name `typescript` (`@tsc-rs/typescript`). website
# and mobile do not use the catalog: they alias `typescript` to TypeScript 6.
catalog:
  typescript: "npm:@tsc-rs/typescript@0.8.0"

overrides:
  yaml: ">=2.8.3"
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"
  # Parents that pin a vulnerable version exactly. Drop each once the parent
  # (wrangler's miniflare, the AWS SDK's @smithy/middleware-compression) is
  # bumped past a release that ships the fixed version itself.
  "miniflare>sharp": ">=0.35.4"
  "miniflare>undici": ">=7.29.1 <8"
  "@smithy/middleware-compression>fflate": ">=0.8.3"
  # @raycast/api depends on an exact @types/react. A third copy can become the
  # hoisted one, and libraries that import React types without declaring them
  # (react-native-svg, @dnd-kit) then resolve it and clash with the app's own
  # (TS2322 on ReactNode in mobile and ui). Keep it on the workspace version.
  "@raycast/api>@types/react": "^19.2.18"

# @generaltranslation/compiler's typings import `vite` but the package declares
# no dependency on it, so TypeScript found whichever vite pnpm hoisted. Adding
# plugin packages whose vitest resolves vite 8 flipped that from web's vite 6
# and broke `vite.config.ts` (two incompatible `Plugin` types). As an optional
# peer it resolves the consuming app's own vite instead.
packageExtensions:
  "@generaltranslation/compiler":
    peerDependencies:
      vite: "*"
    peerDependenciesMeta:
      vite:
        optional: true

# @tsc-rs/typescript is installed under the name `typescript`, but its npm
# version is the tsc-rs release (0.8.0), not 7.x. Peers that ask for
# `typescript@^5 || ^6 || ^7` would otherwise warn on every install.
peerDependencyRules:
  allowAny:
    - typescript

# drizzle-orm has no ClickHouse dialect upstream. The patch adds the built
# `drizzle-orm/clickhouse-core` (dialect, columns, engines, query builders) and
# `drizzle-orm/clickhouse` (a driver binding for `@clickhouse/client`) from
# https://github.com/Infrawrench/drizzle-orm/tree/clickhouse-dialect, plus the
# two type-only branches in `column-builder.d.ts` that teach `BuildColumn` about
# the new dialect, and the `exports` entries that make them importable.
#
# It is additive: no file drizzle already shipped changes behaviour, so a
# drizzle bump only has to re-run the fork's build (see KNOWLEDGE.md, "The
# ClickHouse dialect patch"), not re-derive a merge.
patchedDependencies:
  drizzle-orm@0.45.2: patches/drizzle-orm@0.45.2.patch
  # versionMajorMinor "7.0" so rolldown-plugin-dts 0.27 emits declarations with
  # the tsc-rs binary. See KNOWLEDGE.md, "Type checking".
  "@tsc-rs/typescript@0.8.0": patches/@tsc-rs__typescript@0.8.0.patch

allowBuilds:
  "@google/genai": true
  better-sqlite3: true
  cpu-features: true
  electron: true
  electron-winstaller: true
  msgpackr-extract: true
  node-pty: true
  protobufjs: true
  ssh2: true
  workerd: true
  # Do NOT allow esbuild's postinstall: it replaces bin/esbuild (a JS
  # shim) with a hardlink to the native binary. pnpm's .bin wrappers
  # always `exec node <target>`, so a native binary at that path blows
  # up with "SyntaxError: Invalid or unexpected token". The JS shim +
  # optional @esbuild/* platform packages work fine without postinstall.
  esbuild: false
  # The gt CLI pulls this in for parsing Python sources, which this repo never
  # feeds it — TS/TSX parsing doesn't touch it, so skip the native build.
  tree-sitter-python: false
  # @tsc-rs/typescript's postinstall rewrites bin/tsc into a sh/JS polyglot so a
  # direct exec skips Node. The file stays valid JavaScript, so pnpm's
  # `exec node` wrapper still runs it. This is the `tsc` every TS 7 package
  # script calls.
  "@tsc-rs/typescript": true
  # vsce's optional signing helper downloads a platform binary on install.
  # Packaging the VS Code extension (`vsce package`) never signs; publishing
  # to the Marketplace would, and is not done from this repository.
  "@vscode/vsce-sign": false
  # posthog-js depends on core-js, whose postinstall only prints a funding
  # message. The polyfills themselves need no build step.
  core-js: false

# Exempt from pnpm's minimum release age: the stopgap that distrusts the
# compromised eMudhra intermediate CAs, published the day it was needed.
# Drop the entry once it has aged past the window.
minimumReleaseAgeExclude:
  - kill-emudhra@0.1.1
